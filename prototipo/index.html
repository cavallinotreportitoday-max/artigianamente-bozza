<style>

/* Prototipo della Gestione (B-01, v5). Una sola pagina, dati finti, nessun server.
   Impostazioni prese dal sito (src/app.css, DESIGN.md, Icon.svelte, Galleria.svelte), non a occhio:
   colori, Hanken Grotesk, pulsanti .v3-btn (52 px, angoli 10, sfumatura nera), scelte .v3-tipo (44 px, bordo #d9d9d9),
   riquadro importante .v3-prezzo (bordo + ombra, angoli 16), campi nel riquadro .v3-lato__date (etichetta 10 px maiuscola),
   contatore foto .v3-galleria__conta, intestazione .mm-header (logo 14 px spaziato 3 px, voci 12 px con riga sotto),
   icone a linea con tratto 1.3, curve e tempi delle animazioni (--molla, --scende, 400/300/250/150 ms).
   La composizione è adattata alla Gestione: liste fitte e leggibili in cantiere, barra fissa in basso sul telefono. */
:root {
	--nero: #1b1b1e; --testo: #333333; --grigio: #6b6b6b; --bordo: #cccccc; --bordo-scelta: #d9d9d9; --bordo-campo: #b0b0b0;
	--bianco: #ffffff; --chiaro: #f4f4f4; --fondo: #f6f6f5; --linea: #e6e6e6;
	--ombra: 0 1px 2px rgba(0, 0, 0, 0.06), 0 6px 20px rgba(0, 0, 0, 0.08);
	--ombra-card: 0 6px 16px rgba(0, 0, 0, 0.12);
	--nero-sfumato: linear-gradient(180deg, #2d2d30 0%, #1b1b1e 55%, #111112 100%);
	--rosso-notifica: #ff3040; --ok: #1f7a3a; --ok-f: #e4f2e8; --att: #a85d12; --att-f: #fbeedb; --err: #b3261e; --err-f: #fbe4e2; --prop: #2f4a8a; --prop-f: #e6ebf5;
	--font: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
	--ease-out: cubic-bezier(0.23, 1, 0.32, 1);
	--molla: cubic-bezier(0.32, 0.72, 0, 1); --molla-morbida: cubic-bezier(0.22, 1, 0.36, 1); --scende: cubic-bezier(0.4, 0, 0.7, 0.8);
	--t-tendina: 400ms; --t-chiudi: 300ms; --t-passo: 250ms; --t-rapido: 150ms; --t-breve: 200ms;
	--r: 14px; --rb: 10px; --rt: 6px; --barra-h: 64px; --proto-h: 28px; --hh: 64px;
	color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bianco); color: var(--testo); font-family: var(--font); font-size: 16px; line-height: 1.45; font-weight: 400; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
a, button, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 32px; font-weight: 300; letter-spacing: -0.2px; line-height: 1.15; color: var(--nero); text-wrap: balance; }
h2 { font-size: 17px; font-weight: 600; color: var(--nero); }
h3 { font-size: 20px; font-weight: 500; color: var(--nero); }
a { color: inherit; }
img { display: block; max-width: 100%; }
.num { font-variant-numeric: tabular-nums; }
::selection { background: var(--nero); color: var(--bianco); }
:focus-visible { outline: 2px solid var(--nero); outline-offset: 2px; border-radius: 8px; }
b, strong { font-weight: 600; color: var(--nero); }

/* marchio del sito: ARTIGIANA pieno, MENTE leggero, lettere spaziate */
.marchio { font-weight: 600; letter-spacing: 3px; font-size: 14px; line-height: 1; text-transform: uppercase; color: var(--nero); white-space: nowrap; }
.marchio span { font-weight: 200; }

/* scritta fissa del prototipo */
.proto { position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: calc(var(--proto-h) + env(safe-area-inset-top, 0px)); padding: calc(6px + env(safe-area-inset-top, 0px)) 16px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--nero); color: #fff; font-size: 12px; letter-spacing: 0.3px; text-align: center; }
.proto b { font-weight: 600; color: #fff; }
.rete { position: fixed; top: calc(var(--proto-h) + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 49; padding: 8px 16px; background: #fff4e5; color: #6b3d00; border-bottom: 1px solid #f0d9b5; font-size: 14px; display: flex; gap: 10px; align-items: center; }

/* struttura a telefono */
.app { max-width: 520px; margin: 0 auto; min-height: 100%; padding: calc(var(--proto-h) + 10px + env(safe-area-inset-top, 0px)) 20px calc(var(--barra-h) + 24px + env(safe-area-inset-bottom, 0px)); }
.app.con-rete { padding-top: calc(var(--proto-h) + 64px + env(safe-area-inset-top, 0px)); }
.schermo { animation: entra var(--t-passo) var(--ease-out); }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } }
.testa { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 0 18px; }
.testa > div:first-child { flex: 1 1 160px; min-width: 0; }
.testa .sotto { color: var(--grigio); font-size: 15px; margin-top: 6px; }
.testa .marchio { display: block; margin-bottom: 14px; font-size: 12px; }
.indietro { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 12px 0 0; margin-left: -6px; color: var(--grigio); font-size: 15px; font-weight: 500; }
.indietro svg { width: 22px; height: 22px; }

/* icone: stesso stile del sito (tratto 1.3, angoli tondi) */
svg.ico { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.3; width: 22px; height: 22px; flex: none; }
svg.ico path { vector-effect: non-scaling-stroke; }

/* barra delle sezioni: sul telefono fissa in basso, bianca, icona + nome per tutte e cinque */
.barra { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: var(--bianco); border-top: 1px solid var(--linea); padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px)); }
.barra nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.barra nav button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; padding: 7px 0 5px; border-radius: var(--rb); color: var(--grigio); font-size: 11px; line-height: 1.2; font-weight: 500; position: relative; transition: color 160ms ease; }
.barra nav button svg { width: 24px; height: 24px; }
.barra nav button.attiva { color: var(--nero); font-weight: 600; }
.barra nav button svg.nav-i { width: 24px; height: 24px; overflow: visible; }
.barra nav button::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; background: currentColor; transform: scaleX(0); transition: transform 220ms var(--ease-out); }
.barra nav button.attiva::after { transform: scaleX(1); }
.barra .pallino { position: absolute; top: 3px; right: calc(50% - 24px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--rosso-notifica); border: 2px solid #fff; color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.barra .marchio-barra, .barra .barra-destra, .barra .solo-largo { display: none; }
.barra .barra-destra .et-nome { display: none; }

/* sezioni: fondo bianco, righe sottili; i riquadri solo per quello che conta */
.foglio { margin-bottom: 8px; }
.sez { padding: 18px 0; border-top: 1px solid var(--linea); }
.sez:first-child { border-top: 0; padding-top: 6px; }
.sez > h2 { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sez > h2 .conta { font-weight: 400; color: var(--grigio); font-size: 14px; }
.sez > h2 .link { font-size: 14px; }
.riquadro { padding: 18px 0; border-top: 1px solid var(--linea); }
.riquadro:first-child { border-top: 0; }
.riquadro > h2 { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.riquadro > h2 .conta { font-weight: 400; color: var(--grigio); font-size: 14px; }
.card { border: 1px solid #dddddd; border-radius: 16px; background: var(--bianco); box-shadow: var(--ombra); padding: 18px 20px; }
.etichetta { display: block; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: 1.33px; text-transform: uppercase; color: var(--grigio); }

/* liste: nomi, orari, importi e stati ben leggibili; il secondario in #333, mai troppo chiaro */
.lista { list-style: none; margin: 0; padding: 0; }
.lista li + li { border-top: 1px solid var(--linea); }
.riga { width: 100%; text-align: left; background: none; border: 0; padding: 14px 0; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; color: var(--testo); }
.riga .ora { font-weight: 600; font-size: 17px; min-width: 52px; line-height: 1.2; color: var(--nero); }
.riga .ora small { display: block; font-weight: 400; font-size: 12px; color: var(--grigio); margin-top: 2px; }
.riga .cosa { min-width: 0; }
.riga .cosa b { font-weight: 600; display: block; font-size: 16px; color: var(--nero); }
.riga .cosa span { display: block; color: var(--testo); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.riga .cosa span.tag { display: inline-flex; margin-top: 6px; }
.riga .cosa b span.tag { margin: 0 0 0 6px; vertical-align: middle; }
.riga .freccia { color: var(--bordo); }
.riga .freccia svg { width: 20px; height: 20px; }
.riga .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--nero); }
.riga.urgente .punto { background: var(--att); }
.riga.con-mini { grid-template-columns: 60px 1fr auto; }
.vedi { display: block; width: 100%; margin-top: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--rb); border: 1px solid var(--bordo-scelta); background: var(--bianco); font-size: 15px; font-weight: 500; color: var(--nero); text-align: center; }
.vuoto { color: var(--grigio); font-size: 15px; padding: 6px 0; }
.nota { color: var(--grigio); font-size: 14px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: var(--rt); background: var(--chiaro); color: var(--testo); white-space: nowrap; line-height: 1.25; }
.tag.ok { background: var(--ok-f); color: var(--ok); }
.tag.att { background: var(--att-f); color: var(--att); }
.tag.err { background: var(--err-f); color: var(--err); }
.tag.prop { background: var(--prop-f); color: var(--prop); }
.tag.pieno { background: var(--nero); color: #fff; }

/* scelte a bottone come nel sito (.v3-tipo): 44 px, bordo #d9d9d9, la scelta attiva è nera */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button, .scelte label { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 14px; border: 1px solid var(--bordo-scelta); border-radius: var(--rb); background: var(--bianco); font-size: 15px; font-weight: 500; color: var(--nero); white-space: nowrap; transition: border-color 160ms ease, background-color 160ms ease, color 160ms ease, transform 160ms var(--ease-out); }
.chips button:active, .scelte label:active { transform: scale(0.97); }
.chips button span { color: var(--grigio); font-weight: 400; }
.chips button.attivo, .scelte label:has(input:checked) { background: var(--nero); border-color: var(--nero); color: #fff; }
.chips button.attivo span { color: #cfcfcf; }
.scelte { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.scelte label svg { width: 20px; height: 20px; }
.scelte input { position: absolute; opacity: 0; width: 0; height: 0; }
.cerca { width: 100%; font: inherit; font-size: 16px; min-height: 52px; padding: 0 18px; border-radius: 26px; border: 1px solid var(--bordo-scelta); background: var(--bianco); margin-bottom: 12px; box-shadow: var(--ombra); }
.cerca:focus { outline: 2px solid var(--nero); outline-offset: 0; }

/* pulsanti come nel sito (.v3-btn): 52 px, angoli 10, sfumatura nera, testo 16 px peso 500 */
.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 24px; border: 1px solid transparent; border-radius: var(--rb); background-color: var(--nero); background-image: var(--nero-sfumato); background-origin: border-box; color: #fff; font: inherit; font-size: 16px; line-height: 1; font-weight: 500; text-decoration: none; cursor: pointer; transition: transform 160ms var(--ease-out), filter var(--t-rapido) ease; }
.btn:active { transform: scale(0.97); filter: brightness(0.9); }
@media (hover: hover) and (pointer: fine) { .btn:not(.linea):not(.grigio):not(.pericolo):hover { filter: brightness(1.18); } }
.btn.linea { background: transparent; border-color: var(--nero); color: var(--nero); }
.btn.grigio, .btn.tinta { background: var(--bianco); border-color: var(--bianco); color: var(--nero); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.btn.piccolo { min-height: 44px; padding: 0 16px; font-size: 15px; }
.btn.pieno { width: 100%; }
.btn.pericolo { background: var(--bianco); color: var(--err); border-color: #e3b7b4; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn svg { width: 20px; height: 20px; }
.azioni { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.link { background: none; border: 0; padding: 4px 0; font-size: 15px; color: var(--nero); text-decoration: underline; text-underline-offset: 3px; }
.proposta { opacity: 0.85; }

/* Oggi: il prossimo appuntamento nel riquadro importante del sito (bordo + ombra) */
.prossimo { border: 1px solid #dddddd; border-radius: 16px; background: var(--bianco); box-shadow: var(--ombra-card); padding: 18px 20px 20px; margin: 4px 0 20px; }
.prossimo small { display: block; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: 1.33px; text-transform: uppercase; color: var(--grigio); margin-bottom: 6px; }
.prossimo .ora-grande { font-size: 44px; font-weight: 500; letter-spacing: -1px; line-height: 1; color: var(--nero); }
.prossimo .ora-grande em { font-style: normal; font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--grigio); margin-left: 10px; }
.prossimo b { display: block; font-size: 20px; font-weight: 600; margin-top: 10px; }
.prossimo .dett { display: block; color: var(--testo); font-size: 15px; margin-top: 2px; }
.prossimo .azioni { margin-top: 16px; }
.prossimo .azioni .btn { flex: 1; }
.attesa { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; width: 100%; text-align: left; background: none; border: 0; color: var(--testo); }
.attesa + .attesa { border-top: 1px solid var(--linea); }
.attesa b { font-weight: 600; font-size: 16px; display: block; }
.attesa span { color: var(--testo); font-size: 14px; display: block; }
.attesa .giorni { font-size: 13px; color: var(--grigio); white-space: nowrap; }
.attesa .giorni b { font-size: 20px; display: inline; }
.vuoto-grande { text-align: center; padding: 28px 16px; color: var(--grigio); }
.vuoto-grande svg { width: 36px; height: 36px; margin: 0 auto 10px; }
.vuoto-grande b { display: block; font-weight: 600; margin-bottom: 4px; }

/* scheda pratica: foto contenuta col contatore del sito, titolo leggero, stato, poi il passo principale */
.testata { margin-bottom: 16px; }
.testata .copertina-p { position: relative; border-radius: var(--r); overflow: hidden; background: var(--chiaro); aspect-ratio: 16 / 8; max-height: 180px; margin: 12px 0 14px; }
.testata .copertina-p img { width: 100%; height: 100%; object-fit: cover; }
.testata .copertina-p button { position: absolute; inset: 0; width: 100%; border: 0; background: none; padding: 0; }
.testata .copertina-p .quante { position: absolute; right: 12px; bottom: 12px; padding: 4px 10px; border-radius: var(--rt); background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 12px; line-height: 1.2; font-weight: 500; font-variant-numeric: tabular-nums; pointer-events: none; display: inline-flex; gap: 6px; align-items: center; }
.testata .copertina-p .quante svg { width: 14px; height: 14px; }
.testata .codice { color: var(--testo); font-size: 15px; margin-top: 6px; }
.testata .stati { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.principale { border: 1px solid #dddddd; border-radius: 16px; background: var(--bianco); box-shadow: var(--ombra); padding: 16px 20px 18px; margin-bottom: 20px; }
.principale .motivo { font-size: 16px; color: var(--nero); margin: 4px 0 12px; }
.principale .btn { width: 100%; }
.principale .solo-testo { font-weight: 600; font-size: 17px; color: var(--nero); margin-top: 4px; }
.contatti { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 15px; }
.contatti span { display: inline-flex; gap: 7px; align-items: center; }
.contatti a { text-decoration: none; font-weight: 500; color: var(--nero); }
.coppia { display: grid; grid-template-columns: 118px 1fr; gap: 8px 12px; font-size: 15px; margin: 0; }
.coppia dt { color: var(--grigio); }
.coppia dd { margin: 0; color: var(--testo); }
.coppia dd .tag { vertical-align: middle; }
.stima { font-size: 24px; font-weight: 500; color: var(--nero); letter-spacing: -0.2px; }
.versione { border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px; margin-top: 10px; }
.versione .testa-v { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.versione .testa-v b { font-weight: 600; font-size: 17px; }
.storico { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.storico li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--linea); }
.storico li:first-child { border-top: 0; }
.storico .q { color: var(--grigio); }
textarea.campo, input.campo, select.campo { width: 100%; font: inherit; font-size: 16px; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--bordo-campo); background: var(--bianco); margin-top: 6px; color: var(--nero); }
textarea.campo { resize: vertical; line-height: 1.45; }
textarea.campo:focus, input.campo:focus, select.campo:focus { outline: 2px solid var(--nero); outline-offset: -1px; }
label.campo { display: block; font-size: 14px; color: var(--grigio); margin-top: 14px; }
label.campo > span.etichetta { margin-bottom: 2px; }
/* campi affiancati nello stesso riquadro, come nel sito (etichetta maiuscola piccola, valore sotto) */
.campi-box { display: grid; grid-template-columns: 1fr 1fr; margin-top: 14px; overflow: hidden; border: 1px solid var(--bordo-campo); border-radius: 12px; }
.campi-box.tre { grid-template-columns: 1.3fr 1fr 1fr; }
.campi-box label { display: grid; gap: 2px; min-height: 58px; padding: 9px 12px; background: var(--bianco); font-size: 10px; line-height: 1.2; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--nero); }
.campi-box label + label { border-left: 1px solid var(--bordo-campo); }
.campi-box input { width: 100%; min-width: 0; border: 0; padding: 0; margin: 0; font: inherit; font-size: 14px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--nero); background: transparent; }
.campi-box input:focus { outline: none; }
.campi-box label:focus-within { background: #f7f7f7; }
.avviso { padding: 12px 14px; border-radius: 12px; font-size: 14px; margin-top: 12px; line-height: 1.45; }
.avviso.ok { background: var(--ok-f); color: var(--ok); }
.avviso.err { background: var(--err-f); color: var(--err); }
.avviso.att { background: var(--att-f); color: #6b3d00; }

/* fotografie (dimostrative, da sostituire: cartella foto/, elenco in Altro → Foto dimostrative) */
.mini { width: 60px; height: 60px; border-radius: var(--rb); object-fit: cover; background: var(--chiaro); flex: none; }
.mini-vuota { width: 60px; height: 60px; border-radius: var(--rb); background: var(--chiaro); display: grid; place-items: center; color: var(--bordo); flex: none; }
.galleria { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.galleria button { position: relative; padding: 0; border: 0; background: var(--chiaro); border-radius: var(--rb); overflow: hidden; aspect-ratio: 1; }
.galleria img { width: 100%; height: 100%; object-fit: cover; }
.galleria .piu { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.55); color: #fff; font-weight: 500; font-size: 18px; }
.didascalia { color: var(--grigio); font-size: 12px; margin-top: 8px; }
.copertina { width: 100%; aspect-ratio: 16 / 8; max-height: 180px; object-fit: cover; border-radius: var(--r); margin-bottom: 14px; }
.visore { position: fixed; inset: 0; z-index: 80; background: #000; color: #fff; display: flex; flex-direction: column; animation: sfuma var(--t-tendina) var(--molla); touch-action: pan-y; }
.visore.via { animation: sfuma-via var(--t-passo) ease forwards; }
.visore .vt { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
.visore .vt button { background: rgba(255, 255, 255, 0.92); border: 0; color: var(--nero); font-size: 14px; font-weight: 500; min-height: 36px; padding: 0 14px; border-radius: 18px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); }
.visore .vimg { flex: 1; display: grid; place-items: center; min-height: 0; padding: 0 8px; }
.visore .vimg img { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 6px; }
.visore .vb { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 13px; color: #bbb; }
.visore .vb button { background: rgba(255, 255, 255, 0.92); border: 0; color: var(--nero); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); transition: transform 160ms var(--ease-out); }
.visore .vb button:active { transform: scale(0.94); }
.visore .vb button[disabled] { visibility: hidden; }

/* preventivo: voci */
.voce { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 8px; align-items: center; padding: 12px 0; border-top: 1px solid var(--linea); }
.voce:first-child { border-top: 0; }
.voce input:first-child { grid-column: 1 / -1; }
.voce input.campo { margin: 0; min-height: 44px; padding: 8px 12px; font-size: 15px; }
.voce .togli { width: 40px; height: 44px; border: 0; background: none; color: var(--grigio); border-radius: var(--rb); display: grid; place-items: center; }
.voce .togli:hover { background: var(--err-f); color: var(--err); }
.voce.sola-lettura { grid-template-columns: 1fr auto auto; padding: 10px 0; font-size: 15px; color: var(--testo); }
.voce.sola-lettura .q { color: var(--grigio); font-size: 14px; }
.intest-voci { display: none; }
.totali { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--linea); font-size: 15px; align-items: center; color: var(--testo); }
.totali b { font-size: 24px; letter-spacing: -0.2px; }
.righe { width: 100%; border-collapse: collapse; font-size: 14px; }
.righe td { padding: 8px 0; border-top: 1px solid var(--linea); vertical-align: top; }
.righe td:last-child { text-align: right; white-space: nowrap; }

/* agenda: striscia dei giorni sul telefono, impegni con inizio, fine e durata */
.agenda-testa { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.agenda-testa .tondo { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--bianco); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); display: grid; place-items: center; color: var(--nero); transition: transform 160ms var(--ease-out); }
.agenda-testa .tondo:active { transform: scale(0.94); }
.agenda-testa .titolo { flex: 1; font-weight: 600; font-size: 16px; text-align: center; color: var(--nero); }
.giorni-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
.giorni-strip button { border: 0; background: none; padding: 6px 0 8px; border-radius: var(--rb); display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--grigio); font-size: 12px; font-weight: 500; }
.giorni-strip button b { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 600; color: var(--nero); transition: background-color 160ms ease, color 160ms ease; }
.giorni-strip button.oggi-g b { box-shadow: inset 0 0 0 1.5px var(--nero); }
.giorni-strip button.attivo b { background: var(--nero); color: #fff; box-shadow: none; }
.giorni-strip button i { width: 5px; height: 5px; border-radius: 50%; background: var(--nero); }
.giorni-strip button i.vuoto { background: transparent; }
.giorni-strip button.festivo { color: var(--bordo); }
.giorni-strip button.festivo b { color: var(--grigio); }
.impegno-r { width: 100%; text-align: left; background: none; border: 0; padding: 14px 0; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: stretch; color: var(--testo); }
.impegno-r .quando { display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
.impegno-r .quando b { font-size: 17px; font-weight: 600; }
.impegno-r .quando span { font-size: 14px; color: var(--grigio); margin-top: 2px; }
.impegno-r .blocco { border-left: 3px solid var(--nero); padding-left: 12px; min-width: 0; }
.impegno-r .blocco.proposto { border-left-color: var(--att); }
.impegno-r .blocco.svolto { border-left-color: var(--bordo); }
.impegno-r .blocco.altro { border-left-color: var(--bordo); }
.impegno-r .blocco b { display: block; font-size: 16px; font-weight: 600; }
.impegno-r .blocco span { display: block; color: var(--testo); font-size: 14px; }
.impegno-r .blocco .durata { color: var(--grigio); font-size: 13px; }
.impegno-r .freccia { color: var(--bordo); align-self: center; }
.giorno-libero { color: var(--grigio); font-size: 15px; padding: 24px 0; text-align: center; }
.settimana { display: none; }

/* tendina: sale dal basso come nel sito (molla), chiude con --scende; titolo e X */
.velo { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.42); animation: sfuma var(--t-tendina) var(--molla); }
.velo.via { animation: sfuma-via var(--t-chiudi) var(--scende) forwards; }
.tendina { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-width: 520px; margin: 0 auto; max-height: 90%; overflow: auto; background: var(--bianco); border-radius: 16px 16px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px)); animation: sale var(--t-tendina) var(--molla); box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.12); }
.tendina.via { animation: scende var(--t-chiudi) var(--scende) forwards; }
.tendina .maniglia { width: 36px; height: 4px; border-radius: 2px; background: #d9d9d9; margin: 0 auto 12px; }
.tendina .testa-t { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px; }
.tendina .chiudi-x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--bianco); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); display: grid; place-items: center; flex: none; margin-right: -4px; color: var(--nero); }
.tendina .chiudi-x svg { width: 18px; height: 18px; }
.tendina h3 { margin-bottom: 2px; }
.tendina .azioni { margin-top: 18px; }
.tendina .azioni .btn.pieno + .btn.pieno { margin-top: 2px; }
@keyframes sale { from { transform: translateY(100%); } }
@keyframes scende { to { transform: translateY(100%); } }
@keyframes sfuma { from { opacity: 0; } }
@keyframes sfuma-via { to { opacity: 0; } }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--barra-h) + 20px + env(safe-area-inset-bottom, 0px)); z-index: 70; max-width: 488px; margin: 0 auto; background: var(--nero); color: #fff; padding: 13px 16px; border-radius: 12px; font-size: 14px; animation: entra var(--t-passo) var(--ease-out); box-shadow: var(--ombra-card); }

/* altro */
.voci { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linea); }
.voci li { border-bottom: 1px solid var(--linea); }
.voci button { width: 100%; text-align: left; background: none; border: 0; padding: 16px 0; display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 500; color: var(--nero); }
.voci button .freccia { margin-left: auto; color: var(--bordo); }
.voci button span.nota { margin-left: auto; font-weight: 400; }
.pdf { border: 1px solid var(--linea); border-radius: 16px; padding: 22px; font-size: 14px; line-height: 1.5; color: var(--testo); }
.pdf .marchio { font-size: 14px; letter-spacing: 4px; }
.pdf hr { border: 0; border-top: 1px solid var(--linea); margin: 14px 0; }
.pdf h3 { font-size: 20px; font-weight: 400; }
.filigrana { display: inline-block; font-size: 12px; color: var(--grigio); border: 1px dashed #ccc; padding: 2px 8px; border-radius: var(--rt); margin: 8px 0 12px; }
.passi-pdf { list-style: none; padding: 0; margin: 10px 0 0; font-size: 15px; }
.passi-pdf li { display: flex; gap: 8px; align-items: center; padding: 4px 0; color: var(--grigio); }
.passi-pdf li.fatto { color: var(--nero); }
.passi-pdf li.fatto::before { content: '✓'; color: var(--ok); }
.passi-pdf li:not(.fatto)::before { content: '·'; }
.due { display: block; }


/* ---- lotti 2-4: entrata, persone, ricerca, Erica, materiali (stesso linguaggio del sito) ---- */
.entrata { max-width: 440px; margin: 0 auto; padding: 8vh 0 40px; }
.entrata .marchio { display: block; margin-bottom: 28px; }
.entrata h1 { font-size: 40px; }
.entrata .sotto { color: var(--grigio); font-size: 17px; margin: 8px 0 22px; }
.persona { width: 100%; display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 16px 18px; margin-bottom: 12px; background: var(--bianco); border: 1px solid #dddddd; border-radius: 16px; box-shadow: var(--ombra); transition: transform 160ms var(--ease-out), box-shadow 200ms ease; }
.persona:active { transform: scale(0.98); }
@media (hover: hover) { .persona:hover { box-shadow: var(--ombra-card); } }
.persona b { display: block; font-size: 18px; font-weight: 600; }
.persona span span { display: block; color: var(--testo); font-size: 14px; margin-top: 2px; }
.persona .freccia { color: var(--bordo); }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--nero); background-image: var(--nero-sfumato); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 18px; flex: none; }
.avatar.chiaro { background: var(--chiaro); background-image: none; color: var(--nero); }
.avatar.erica { width: 40px; height: 40px; background: var(--chiaro); background-image: none; color: var(--nero); }
.avatar.erica svg { width: 22px; height: 22px; }
.riga > .avatar { width: 44px; height: 44px; font-size: 16px; }
.riga > .avatar.erica { width: 40px; height: 40px; }
.tondo-cerca { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bianco); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); display: grid; place-items: center; color: var(--nero); flex: none; transition: transform 160ms var(--ease-out); }
.tondo-cerca:active { transform: scale(0.94); }
.tondo-cerca.piccolo { width: 36px; height: 36px; margin-right: 8px; }
.tondo-cerca.piccolo svg { width: 18px; height: 18px; }
.gruppo-r { font-size: 13px; font-weight: 600; color: var(--grigio); margin: 14px 0 2px; }
.chiedi-erica { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 6px 0; border: 0; background: none; font-size: 15px; font-weight: 500; color: var(--nero); text-decoration: underline; text-underline-offset: 3px; }
.chiedi-erica svg { width: 18px; height: 18px; }
.chiedi-erica.sola { margin: 0 0 16px; }
.profilo { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; padding: 6px 0 20px; }
.profilo b { display: block; font-size: 18px; }
.profilo span span { color: var(--grigio); font-size: 14px; }
.mat { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; }
.mat-testo { text-align: left; background: none; border: 0; padding: 0; min-width: 0; color: var(--testo); }
.mat-testo b { display: block; font-size: 16px; }
.mat-testo span { display: block; font-size: 14px; color: var(--testo); margin-top: 2px; }
.mat-testo span.tag { display: inline-flex; margin-top: 6px; }
.mat .btn.piccolo { min-height: 40px; padding: 0 12px; font-size: 14px; }
.mat .btn svg { width: 16px; height: 16px; }
.negozio { font-size: 14px; font-weight: 600; color: var(--grigio); margin: 12px 0 0; display: flex; gap: 6px; }
.negozio .conta { font-weight: 400; }
.passi { margin-top: 16px; }
.passi h2 { font-size: 15px; margin-bottom: 6px; }
.passi ol { margin: 0; padding-left: 20px; color: var(--testo); }
.passi li { margin: 4px 0; }
.chat { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; padding: 4px 0; }
.bolla { max-width: 88%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.45; white-space: pre-line; }
.bolla.io { align-self: flex-end; background: var(--nero); background-image: var(--nero-sfumato); color: #fff; border-bottom-right-radius: 4px; }
.bolla.erica { align-self: flex-start; background: var(--chiaro); color: var(--nero); border-bottom-left-radius: 4px; }
.chat-in { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 6px; }
.chat-in .cerca { border-radius: var(--rb); min-height: 52px; }
.perche { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; background: #f7f7f7; border-radius: 12px; padding: 10px 12px; margin: 10px 0 12px; font-size: 14px; color: var(--nero); }
textarea.testo-proposta { font-size: 15px; line-height: 1.5; background: #fbfbfa; }
.galleria.scegli { grid-template-columns: repeat(4, 1fr); margin-top: 12px; }
.riga.avv.letto .punto { background: var(--bordo); }
.riga.avv.letto .cosa b { font-weight: 500; }
.nota-fabri { margin-top: 8px !important; font-weight: 500; color: var(--nero) !important; }


/* Erica in basso a destra, come «Messaggi» di Instagram: tondo sul telefono (sopra la barra), pillola sul computer */
.erica-fab { position: fixed; z-index: 45; right: 16px; bottom: calc(var(--barra-h) + 16px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 12px; border: 1px solid #e3e3e3; background: var(--bianco); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.14); border-radius: 999px; padding: 6px; color: var(--nero); transition: transform 160ms var(--ease-out), box-shadow 200ms ease; animation: entra var(--t-passo) var(--ease-out); }
.erica-fab:active { transform: scale(0.96); }
.erica-fab .avatar.erica { width: 46px; height: 46px; }
.erica-fab .avatar.erica svg { width: 24px; height: 24px; }
.erica-fab > b, .erica-fab .mini-p { display: none; }
.erica-fab .badge { position: absolute; top: -2px; left: 34px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; border: 2px solid #fff; background: var(--rosso-notifica); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.app.con-fab { padding-bottom: calc(var(--barra-h) + 96px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) {
	.erica-fab { right: 28px; bottom: 28px; padding: 9px 12px 9px 12px; gap: 14px; min-height: 64px; }
	.erica-fab .avatar.erica { width: 40px; height: 40px; }
	.erica-fab > b { display: inline; font-size: 17px; font-weight: 600; padding-right: 4px; }
	.erica-fab .badge { left: 38px; top: 6px; }
	.erica-fab .mini-p { display: inline-flex; align-items: center; }
	.erica-fab .mini-p img, .erica-fab .mini-p span { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; margin-left: -8px; background: var(--chiaro); display: grid; place-items: center; font-size: 13px; }
	.erica-fab .mini-p > :first-child { margin-left: 0; }
	.app.con-fab { padding-bottom: 120px; }
	@media (hover: hover) { .erica-fab:hover { box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18); } }
}


/* ---- Scheda pratica come la pagina di un lavoro del sito: valori misurati su ristrutturazioni.html (Copertina, v3-lato) ---- */
.pr-testa { display: grid; gap: 20px; margin: 6px 0 8px; }
.pr-titolo { font-size: 34px; line-height: 1.08; font-weight: 300; letter-spacing: -0.68px; color: var(--nero); }
.pr-intro { margin-top: 10px; font-size: 16px; line-height: 1.6; font-weight: 300; color: var(--testo); }
.pr-lista { display: none; }
.pr-img { position: relative; border-radius: 20px; overflow: hidden; background: var(--fondo); aspect-ratio: 16 / 9; }
.pr-img img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.pr-img.vuota { display: grid; place-items: center; }
.pr-vuota-testo { display: grid; justify-items: center; gap: 6px; color: var(--grigio); font-size: 14px; }
.pr-indietro { position: absolute; top: 14px; left: 14px; z-index: 2; width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 10px; background: #fff; color: var(--nero); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); transition: transform 160ms var(--ease-out); }
.pr-indietro:active { transform: scale(0.94); }
.pr-indietro svg { width: 20px; height: 20px; }
.pr-pill { position: absolute; top: 19px; left: 66px; z-index: 2; display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 8px; background: #fff; color: var(--nero); font-size: 13px; line-height: 1; font-weight: 600; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.14); pointer-events: none; }
.pr-pill svg { width: 15px; height: 15px; }
.pr-conta { position: absolute; right: 12px; bottom: 12px; z-index: 1; padding: 4px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 12px; line-height: 1.2; font-weight: 500; font-variant-numeric: tabular-nums; pointer-events: none; }
.pr-freccia { position: absolute; top: 50%; z-index: 2; width: 32px; height: 32px; margin-top: -16px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.92); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); color: var(--nero); opacity: 0; transition: opacity 160ms ease, transform 160ms var(--ease-out); }
.pr-freccia svg { width: 16px; height: 16px; }
.pr-freccia.prec { left: 12px; } .pr-freccia.succ { right: 12px; }
.pr-freccia:disabled { visibility: hidden; }
.pr-freccia:active { transform: scale(0.94); }
.pr-img:hover .pr-freccia, .pr-freccia:focus-visible { opacity: 1; }
@media (hover: none) { .pr-freccia { display: none; } }
.pr-punti { display: flex; justify-content: center; gap: 2px; margin-top: 10px; }
.pr-punto { width: 24px; height: 16px; display: grid; place-items: center; padding: 0 3px; border: 0; background: none; }
.pr-punto::before { content: ''; width: 6px; height: 6px; border-radius: 3px; background: #c7c7c7; transition: width 220ms var(--ease-out), background-color 160ms ease; }
.pr-punto.attivo::before { width: 18px; background: var(--nero); }
.pr-due { display: block; }
.pr-lato { margin: 18px 0 8px; order: -1; }
.pr-due { display: flex; flex-direction: column; }
.pr-card { padding: 24px; border: 1px solid #dddddd; border-radius: 16px; background: #fff; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12); }
.pr-prezzo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin: 0 0 6px; font-size: 22px; line-height: 1.25; font-weight: 300; color: #222; }
.pr-prezzo strong { font-weight: 600; color: #222; text-decoration: underline; text-underline-offset: 4px; }
.pr-prezzo small { font-size: 15px; color: #6a6a6a; }
.pr-condizione { font-size: 14px; line-height: 1.45; font-weight: 300; color: #222; }
.pr-dettagli { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; padding: 6px 0; border: 0; background: none; font-size: 14px; font-weight: 600; color: #222; text-decoration: underline; text-underline-offset: 3px; }
.pr-dettagli svg { width: 16px; height: 16px; transform: rotate(90deg); }
.pr-box { display: grid; grid-template-columns: 1fr 1fr; margin: 18px 0 0; overflow: hidden; border: 1px solid #b0b0b0; border-radius: 12px; }
.pr-cella { display: grid; gap: 2px; min-height: 58px; padding: 10px 12px; background: #fff; color: #222; text-decoration: none; align-content: center; }
.pr-cella + .pr-cella { border-left: 1px solid #b0b0b0; }
.pr-cella.intera { grid-column: 1 / -1; border-left: 0; border-top: 1px solid #b0b0b0; }

const quando = (iso) => { if (!iso) return ''; const x = d(iso); return `${x.getUTCDate()} ${MESI[x.getUTCMonth()].slice(0, 3)}${iso.length > 10 ? ', ' + iso.slice(11, 16) : ''}`; };

/* ===================== AZIONE SUGGERITA ===================== */
// Solo lettura: guarda il preventivo corrente e gli appuntamenti, non cambia niente. Il motivo è sempre scritto.
// «Verifica la pratica» solo per contraddizioni concrete, con scritto cosa non torna e un tasto per andare a vedere.
function suggerita(p) {
	const apps = appDi(p.id), pvs = prevDi(p.id), pv = pvs.at(-1) ?? null;
	const futuri = apps.filter((a) => aperte(a) && a.giorno >= OGGI);
	const passatiProposti = apps.filter((a) => a.stato === 'proposto' && a.giorno < OGGI);
	const lavoroAttivo = apps.find((a) => aperte(a) && a.tipo !== 'sopralluogo' && a.tipo !== 'altro');
	const sopr = apps.filter((a) => a.tipo === 'sopralluogo');
	const soprAperto = sopr.find((a) => aperte(a) && a.giorno >= OGGI);
	const soprSvolto = sopr.some((a) => a.stato === 'svolto');
	const accettate = pvs.filter((v) => v.stato === 'accettata');
	// contraddizioni concrete
	if (p.archiviata || chiusa(p)) {
		if (futuri.length) return { testo: 'Verifica la pratica', motivo: `Pratica «${NOMI_STATO[p.stato]}», ma c'è ancora un appuntamento attivo: ${NOMI_TIPO[futuri[0].tipo].toLowerCase()} ${giornoBreve(futuri[0].giorno)} alle ${futuri[0].inizio}. Annullalo o riapri la pratica.`, azione: 'imp-' + futuri[0].id };
		return null;
	}
	if (passatiProposti.length) { const a = passatiProposti[0]; return { testo: 'Verifica la pratica', motivo: `${NOMI_TIPO[a.tipo]} del ${giornoBreve(a.giorno)} ancora «proposto»: non è stato confermato né annullato. Cosa è successo?`, azione: 'imp-' + a.id }; }
	if (pv?.stato === 'rifiutata' && lavoroAttivo) return { testo: 'Verifica la pratica', motivo: `Preventivo ${pv.numero} registrato come rifiutato, ma ${NOMI_TIPO[lavoroAttivo.tipo].toLowerCase()} ancora confermato per ${giornoBreve(lavoroAttivo.giorno)}.`, azione: 'imp-' + lavoroAttivo.id };
	if (accettate.length > 1 || (accettate.length === 1 && pv && pv.stato !== 'accettata' && pv.stato !== 'bozza' && pv.stato !== 'superata')) return { testo: 'Verifica la pratica', motivo: `${pvs.length} versioni del preventivo e non è chiaro quale valga: ${pvs.map((v) => (v.numero ?? 'bozza v' + v.n) + ' ' + NOMI_PREV[v.stato].toLowerCase()).join(', ')}.`, azione: 'prev' };
	// passi normali
	if (p.stato === 'in_corso') {
		if (lavoroAttivo) return { testo: 'Lavoro in corso', motivo: `Prossima giornata ${giornoBreve(lavoroAttivo.giorno)} alle ${lavoroAttivo.inizio}.`, azione: null };
		return { testo: 'Programma o chiudi', motivo: 'Nessuna prossima giornata pianificata. Verifica se programmare un altro intervento o aggiornare lo stato.', azione: 'nuovo-lavoro' };
	}
	if (pv?.stato === 'accettata') {
		if (lavoroAttivo?.stato === 'proposto') return { testo: 'Conferma la data del lavoro', motivo: `Preventivo accettato. Lavoro proposto per ${giornoBreve(lavoroAttivo.giorno)}, non ancora confermato.`, azione: 'imp-' + lavoroAttivo.id };
		if (lavoroAttivo) return { testo: 'Tutto programmato', motivo: `Lavoro confermato per ${giornoBreve(lavoroAttivo.giorno)} alle ${lavoroAttivo.inizio}.${p.stato !== 'programmata' ? ` Lo stato è ancora «${NOMI_STATO[p.stato]}»: aggiornalo quando vuoi.` : ''}`, azione: p.stato !== 'programmata' ? 'stato' : null };
		return { testo: 'Programma il lavoro', motivo: 'Preventivo registrato come accettato. Nessun appuntamento di lavoro presente.', azione: 'nuovo-lavoro' };
	}
	if (pv?.stato === 'rifiutata') return { testo: 'Decidi come chiudere', motivo: 'Preventivo registrato come rifiutato. La pratica è ancora aperta.', azione: 'stato' };
	if (pv?.stato === 'inviata') return { testo: 'In attesa della risposta', motivo: `Preventivo inviato ${quando(pv.inviato)} (${giorniDa(pv.inviato)} giorni fa). Quando il cliente risponde, registralo qui.`, azione: 'prev' };
	if (pv?.stato === 'pronta') return { testo: 'Mandalo al cliente e segna inviato', motivo: `PDF ${pv.numero} pronto. L'invio lo fai tu (WhatsApp o email); poi registralo.`, azione: 'prev' };
	if (pv?.stato === 'bozza') return { testo: 'Completa la bozza e genera il PDF', motivo: 'Preventivo in bozza, nessun numero ancora.', azione: 'prev-' + pv.id };
	if (soprAperto?.stato === 'proposto') return { testo: 'Conferma il sopralluogo', motivo: `Sopralluogo proposto per ${giornoBreve(soprAperto.giorno)} alle ${soprAperto.inizio}, non confermato.`, azione: 'imp-' + soprAperto.id };
	if (soprAperto) return { testo: 'Sopralluogo fissato', motivo: `${giornoBreve(soprAperto.giorno)} alle ${soprAperto.inizio}. Dopo, prepara il preventivo.`, azione: null };
	if (soprSvolto) return { testo: 'Prepara il preventivo', motivo: 'Sopralluogo svolto, nessun preventivo ancora.', azione: 'prev' };
	if (!sopr.length) return { testo: 'Fissa il sopralluogo', motivo: p.stato === 'nuova' ? 'Richiesta nuova, nessun appuntamento.' : 'Nessun sopralluogo in agenda.', azione: 'nuovo-sopralluogo' };
	return { testo: 'Nessun passo suggerito', motivo: 'Dati non sufficienti per suggerire un passo.', azione: null };
}

/* ===================== OGGI: cosa fare ===================== */
// Regola: 1) prima ciò che richiede attenzione oggi (appuntamenti imminenti da confermare, con il motivo scritto);
// 2) poi tutto il resto dalla cosa più vecchia, con scritto da quanto attende. La categoria da sola non decide l'urgenza.
function daFare() {
	const out = [];
	for (const p of D.pratiche) {
		if (p.archiviata || chiusa(p)) continue;
		const pv = prevCorrente(p.id);
		const imminente = appDi(p.id).find((a) => a.stato === 'proposto' && a.giorno >= OGGI && a.giorno <= piuGiorni(OGGI, 1));
		if (imminente) out.push({ oggi: true, p, cosa: 'Da confermare', det: `${NOMI_TIPO[imminente.tipo]} ${imminente.giorno === OGGI ? 'oggi' : giornoBreve(imminente.giorno)} alle ${imminente.inizio} · ancora proposto`, da: imminente.giorno + 'T' + imminente.inizio });
		else if (pv?.stato === 'pronta') out.push({ p, cosa: 'Preventivo da mandare', det: `${pv.numero} · ${p.servizio}`, da: pv.generato });
		else if (pv?.stato === 'accettata' && !appDi(p.id).some((a) => aperte(a) && a.tipo !== 'sopralluogo' && a.tipo !== 'altro') && p.stato !== 'in_corso') out.push({ p, cosa: 'Lavoro da programmare', det: `${p.servizio} · accettato ${quando(pv.accettato)}`, da: pv.accettato });
		else if (p.stato === 'nuova') out.push({ p, cosa: 'Nuova richiesta', det: `${p.servizio} · ${p.comune}`, da: p.ricevuta });
		else if (!pv && appDi(p.id).some((a) => a.tipo === 'sopralluogo' && a.stato === 'svolto')) { const s = appDi(p.id).filter((a) => a.tipo === 'sopralluogo' && a.stato === 'svolto').at(-1); out.push({ p, cosa: 'Preventivo da preparare', det: `${p.servizio} · sopralluogo fatto ${quando(s.giorno)}`, da: s.giorno + 'T' + s.fine }); }
		else { const s = appDi(p.id).find((a) => a.stato === 'proposto' && a.giorno >= OGGI); if (s) out.push({ p, cosa: 'Da confermare', det: `${NOMI_TIPO[s.tipo]} ${giornoBreve(s.giorno)} alle ${s.inizio}`, da: p.ricevuta }); }
	}
	for (const x of out) x.attesa = x.oggi ? '' : (giorniDa(x.da) >= 1 ? `attende da ${giorniDa(x.da)} ${giorniDa(x.da) === 1 ? 'giorno' : 'giorni'}` : 'di oggi');
	return out.sort((a, b) => (b.oggi ? 1 : 0) - (a.oggi ? 1 : 0) || a.da.localeCompare(b.da));
}
function inAttesa() {
	return D.pratiche.filter((p) => !chiusa(p) && prevCorrente(p.id)?.stato === 'inviata').map((p) => ({ p, pv: prevCorrente(p.id) })).sort((a, b) => a.pv.inviato.localeCompare(b.pv.inviato));
}

let fotoTesta = { id: null, i: 0 };
function fotoTestaA(i) {
	const p = pratica(fotoTesta.id); if (!p) return; const f = fotoDi(p); if (i < 0 || i >= f.length) return;
	fotoTesta.i = i; document.getElementById('pr-foto').src = src(f[i]);

function agenda() {
	// Telefono: striscia dei 7 giorni della settimana + impegni del giorno scelto. Schermo largo: le 7 giornate affiancate.
	const lun = lunediDi(agendaGiorno);
	const giorni = Array.from({ length: 7 }, (_, i) => piuGiorni(lun, i));
	const del = (g) => D.appuntamenti.filter((a) => a.giorno === g && a.stato !== 'annullato' && vedoApp(a)).sort((a, b) => a.inizio.localeCompare(b.inizio));
	window._sposta = (n) => { agendaGiorno = piuGiorni(agendaGiorno, 7 * n); render(); };
	const titolo = `${giornoBreve(giorni[0])} – ${giornoBreve(giorni[6])}`;
	const nomeDi = (a) => { const p = a.praticaId ? pratica(a.praticaId) : null; return [p ? esc(p.nome) : esc(a.titolo), p ? `${NOMI_TIPO[a.tipo]}, ${lavoroBreve(p)}` : NOMI_TIPO[a.tipo]]; };
	const classe = (a) => a.stato === 'proposto' ? 'proposto' : a.stato === 'svolto' ? 'svolto' : a.praticaId ? '' : 'altro';
	const strip = `<div class="giorni-strip">${giorni.map((g) => { const n = del(g).length, dom = d(g).getUTCDay() === 0; return `<button type="button" class="${g === agendaGiorno ? 'attivo' : ''} ${g === OGGI ? 'oggi-g' : ''} ${dom ? 'festivo' : ''}" onclick="agendaGiorno='${g}';render()" aria-label="${giornoLungo(g)}">${GIORNI_B[d(g).getUTCDay()]}<b>${d(g).getUTCDate()}</b><i class="${n ? '' : 'vuoto'}"></i></button>`; }).join('')}</div>`;
	const listaGiorno = () => { const l = del(agendaGiorno); return `<section class="riquadro lista-giorno-largo"><h2>${giornoLungo(agendaGiorno).charAt(0).toUpperCase() + giornoLungo(agendaGiorno).slice(1)}${agendaGiorno === OGGI ? ' <span class="tag pieno">oggi</span>' : ''} <span class="conta">${l.length ? l.length + (l.length === 1 ? ' impegno' : ' impegni') : ''}</span></h2>${l.length ? `<ul class="lista">${l.map((a) => { const [n, t] = nomeDi(a); return `<li><button type="button" class="impegno-r" onclick="vai('imp','${a.id}')"><span class="quando num"><b>${a.inizio}</b><span>${a.fine}</span></span><span class="blocco ${classe(a)}"><b>${n}</b><span>${t} · ${a.chi.map(nomeOp).join(', ')}</span><span class="durata">${durata(a)}${a.stato === 'proposto' ? ' · da confermare' : a.stato === 'svolto' ? ' · svolto' : ''}</span></span><span class="freccia">${I.freccia}</span></button></li>`; }).join('')}</ul>` : `<p class="giorno-libero">Giornata libera.</p>`}</section>`; };
	const settimana = `<div class="settimana">${giorni.map((g) => { const l = del(g), dom = d(g).getUTCDay() === 0; return `<div class="colonna ${g === OGGI ? 'oggi-c' : ''} ${dom ? 'festivo' : ''}"><h3>${GIORNI_B[d(g).getUTCDay()]}<b>${d(g).getUTCDate()}</b></h3>${l.length ? l.map((a) => { const [n, t] = nomeDi(a); return `<button type="button" class="evento ${classe(a)}" onclick="vai('imp','${a.id}')"><b class="num">${a.inizio}–${a.fine}</b>${n}<span>${t}</span><span>${a.chi.map(nomeOp).join(', ')}${a.stato === 'proposto' ? ' · da confermare' : ''}</span></button>`; }).join('') : '<p class="libero">Libero</p>'}</div>`; }).join('')}</div>`;
	return testa('Agenda', '', `<button type="button" class="btn piccolo linea proposta" onclick="apriNuovoApp(null,null,'${agendaGiorno}')">${I.piu} Nuovo <span class="tag prop">da realizzare</span></button>`)
		+ `<div class="agenda-testa"><button type="button" class="tondo" aria-label="Settimana prima" onclick="_sposta(-1)">${I.indietro}</button><span class="titolo">${titolo.charAt(0).toUpperCase() + titolo.slice(1)}</span><button type="button" class="tondo" aria-label="Settimana dopo" onclick="_sposta(1)">${I.freccia}</button>${lun !== lunediDi(OGGI) || agendaGiorno !== OGGI ? `<button type="button" class="btn piccolo tinta" onclick="agendaGiorno='${OGGI}';render()">Oggi</button>` : ''}</div>`
		+ strip + listaGiorno() + settimana
		+ `<p class="nota" style="margin-top:10px">Un appuntamento nuovo si crea dalla pratica. «Nuovo» da qui: da realizzare.</p>`;
}

		<div class="foglio"><section class="sez"><h2>Note per chi va</h2><textarea class="campo" rows="2" placeholder="es. citofono rotto, chiamare arrivando" onchange="salvaNoteApp('${a.id}',this.value)">${esc(a.note ?? '')}</textarea><p class="nota" style="margin-top:6px">Le vede ${a.chi.map(nomeOp).join(', ')}. Si salvano quando esci dal campo.</p></section></div></div>`;

		+ `<section class="riquadro">${lista.length ? `<ul class="lista">${lista.map((c) => { const n = D.pratiche.filter((p) => p.clienteId === c.id).length; return `<li><button type="button" class="riga" onclick="vai('cliente','${c.id}')"><span class="punto"></span><span class="cosa"><b>${esc(c.nome)}</b><span class="num">${c.tel} · ${n} pratic${n === 1 ? 'a' : 'he'}</span></span><span class="freccia">${I.freccia}</span></button></li>`; }).join('')}</ul>` : vuotoGrande('Nessun cliente trovato', `Niente per «${esc(cercaTesto)}».`)}</section>`
		+ `<p class="nota">Chi scrive dal sito entra in rubrica quando lo colleghi dalla sua pratica («Crea e collega»).</p>`;
}
function schedaCliente(id) {

		+ `<section class="riquadro"><h2>Pratiche collegate <span class="conta">${prs.length}</span></h2>${prs.length ? `<ul class="lista">${prs.map((p) => `<li><button type="button" class="riga con-mini" onclick="vai('p','${p.id}')">${miniatura(p)}<span class="cosa"><b>${esc(titoloLavoro(p))}</b><span>${p.codice} · ${NOMI_STATO[p.stato]}</span></span><span class="freccia">${I.freccia}</span></button></li>`).join('')}</ul>` : '<p class="nota">Nessuna pratica collegata.</p>'}</section>`;

function apriCliente(id) {
	const c = id ? cliente(id) : { nome: '', tel: '', email: '', indirizzo: '', note: '' };
	apriTendina(`<label class="campo">Nome e cognome<input class="campo" name="cl-nome" value="${esc(c.nome)}" autocomplete="off"></label>
	<label class="campo">Telefono<input class="campo num" name="cl-tel" value="${esc(c.tel)}" inputmode="tel"></label>
	<label class="campo">Email (facoltativa)<input class="campo" name="cl-email" value="${esc(c.email)}" inputmode="email"></label>
	<label class="campo">Indirizzo<input class="campo" name="cl-indirizzo" value="${esc(c.indirizzo)}"></label>
	<label class="campo">Note (facoltative)<input class="campo" name="cl-note" value="${esc(c.note ?? '')}"></label>
	<div id="cl-esito"></div>
	<div class="azioni"><button type="button" class="btn pieno" onclick="salvaCliente('${id ?? ''}')">${id ? 'Salva le modifiche' : 'Crea il cliente'}</button><button type="button" class="btn linea pieno" onclick="chiudiTendina()">Annulla</button></div>`, id ? 'Modifica cliente' : 'Nuovo cliente');
	setTimeout(() => document.querySelector('[name="cl-nome"]')?.focus(), 50);
}
function salvaCliente(id) {
	if (bloccoRete()) return;
	const v = (n) => (valore(n) ?? '').trim();
	const dati = { nome: v('cl-nome'), tel: v('cl-tel'), email: v('cl-email'), indirizzo: v('cl-indirizzo'), note: v('cl-note') };
	if (dati.nome.length < 2) return esito('cl-esito', 'Serve il nome del cliente.');
	if (dati.tel.replace(/\D/g, '').length < 6) return esito('cl-esito', 'Controlla il telefono: troppo corto.');
	if (dati.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(dati.email)) return esito('cl-esito', 'L\'email non sembra giusta (manca la @ o il punto).');
	const doppio = D.clienti.find((c) => c.id !== id && c.tel.replace(/\D/g, '') === dati.tel.replace(/\D/g, ''));
	if (doppio && !id) return esito('cl-esito', `Questo numero è già di <b>${esc(doppio.nome)}</b>. <button type="button" class="link" onclick="chiudiTendina();vai('cliente','${doppio.id}')">Apri la sua scheda</button>`, 'att');
	if (id) { Object.assign(cliente(id), dati); salva(); chiudiTendina(); render(); toast('Cliente aggiornato.'); }
	else { const c = { id: nuovoId('c'), ...dati }; D.clienti.push(c); salva(); chiudiTendina(); toast('Cliente creato.'); vai('cliente', c.id); }
}

function creaPreventivo(praticaId, dallaStima) {
	if (bloccoRete()) return;

	const righe = dallaStima ? righeDaStima(p) : [['', '1', 0, 0]];
	const pv = { id: nuovoId('p'), praticaId, n: prevDi(praticaId).length + 1, numero: null, stato: 'bozza', righe, iva: 22 };
	D.preventivi.push(pv);
	p.storico.push([adessoIso(), `Preventivo v${pv.n} in bozza${dallaStima ? ' (dalla stima)' : ''}`]);
	salva(); vai('prev', pv.id);
}
function righeDaStima(p) {
	const s = { Imbiancatura: [['Preparazione e protezione ambienti', '1', 120, 120], ['Tinteggiatura pareti, 2 mani', '50 m²', 14, 700], ['Tinteggiatura soffitti', '28 m²', 12, 336]], Parquet: [['Posa parquet prefinito rovere, flottante', '40 m²', 38, 1520], ['Materiale: prefinito rovere naturale 14 mm', '40 m²', 32, 1280], ['Tappetino e profili', '1', 110, 110]], 'Montaggio mobili': [['Montaggio armadio grande', '1', 220, 220], ['Montaggio letto', '1', 90, 90]], Falegnameria: [['Riparazione porta interna (regolazione e piallatura)', '1', 75, 75]] };
	return (s[p.servizio] ?? [['Lavoro come da sopralluogo', '1', 0, 0]]).map((r) => [...r]);
}
function nuovaVersione(praticaId) {
	if (bloccoRete()) return;
	const vecchio = prevCorrente(praticaId);
	if (vecchio.stato === 'inviata') vecchio.stato = 'superata';
	const pv = { id: nuovoId('p'), praticaId, n: vecchio.n + 1, numero: null, stato: 'bozza', righe: vecchio.righe.map((r) => [...r]), iva: vecchio.iva };
	D.preventivi.push(pv);
	pratica(praticaId).storico.push([adessoIso(), `Nuova versione v${pv.n} in bozza`]);
	salva(); vai('prev', pv.id);
}

function pv_riga(id, i, k, v) { const pv = D.preventivi.find((x) => x.id === id); if (k === 3) { const n = parseFloat(String(v).replace(',', '.')) || 0; pv.righe[i][3] = Math.round(n * 100) / 100; } else pv.righe[i][k] = v; salva(); render(); }

/* ===================== TENDINE (moduli) ===================== */
let tendinaAperta = null;
function apriTendina(html, titolo = '') {
	chiudiTendina(true);
	const s = document.getElementById('strato');
	s.innerHTML = `<div class="velo" onclick="chiudiTendina()"></div><div class="tendina" role="dialog" aria-modal="true" aria-label="${esc(titolo)}"><div class="maniglia"></div><div class="testa-t"><h3>${titolo}</h3><button type="button" class="chiudi-x" aria-label="Chiudi" onclick="chiudiTendina()">${I.chiudi}</button></div>${html}</div>`;
	tendinaAperta = true;
}
function chiudiTendina(subito = false) {
	const s = document.getElementById('strato');
	tendinaAperta = false;
	if (!s.firstChild) return;

function salvaAMano(forza = false) {

const rigaMat = (m, conPratica = false, conStato = true) => { const p = pratica(m.praticaId); const prossimo = m.stato === 'da_comprare' ? ['preso', 'Preso'] : m.stato === 'preso' ? ['in_cantiere', 'In cantiere'] : null; return `<li class="mat"><button type="button" class="mat-testo" onclick="apriMateriale('${m.id}')"><b>${esc(m.nome)}</b><span>${esc(m.qta)}${conPratica && p ? ' · ' + esc(titoloLavoro(p)) : ''}${m.chi ? ' · ritira ' + nomeOp(m.chi) : ''}${conStato && m.fornitore && m.stato === 'da_comprare' ? ' · ' + esc(m.fornitore) : ''}</span>${conStato ? tagMat(m.stato) : ''}</button>${prossimo ? `<button type="button" class="btn piccolo linea" onclick="statoMateriale('${m.id}','${prossimo[0]}')">${I.spunta}${prossimo[1]}</button>` : ''}</li>`; };

	const prossimo = mie.find((a) => a.inizio >= '08:00') ?? mie[0];

	const hero = prossimo ? `<section class="prossimo"><div class="testo-p"><small>Il tuo prossimo impegno · oggi</small><div class="ora-grande num">${prossimo.inizio}<em>fino alle ${prossimo.fine} · ${durata(prossimo)}</em></div><b>${esc(pp ? pp.nome : prossimo.titolo)}</b><span class="dett">${NOMI_TIPO[prossimo.tipo]}${pp ? ', ' + lavoroBreve(pp) : ''}</span><span class="dett">${esc(prossimo.luogo)}</span>${prossimo.note ? `<span class="dett nota-fabri">«${esc(prossimo.note)}»</span>` : ''}</div><div class="azioni"><button type="button" class="btn" onclick="vai('imp','${prossimo.id}')">Apri</button><a class="btn linea" href="${linkMappe(prossimo.luogo)}" target="_blank" rel="noopener">${I.mappa} Mappe</a>${pp ? `<a class="btn linea" href="tel:${pp.tel.replace(/\s/g, '')}">${I.tel} Chiama</a>` : ''}</div></section>`
		: `<section class="prossimo"><div class="testo-p"><small>Oggi</small><b style="margin-top:0">Nessun impegno per te</b><span class="dett">Se Fabri ti assegna qualcosa lo vedi qui.</span></div></section>`;
	const riga = (a) => { const p = a.praticaId ? pratica(a.praticaId) : null; return `<li><button type="button" class="riga" onclick="vai('imp','${a.id}')"><span class="ora num">${a.inizio}<small>${durata(a)}</small></span><span class="cosa"><b>${esc(p ? p.nome : a.titolo)}</b><span>${NOMI_TIPO[a.tipo]} · ${esc(a.luogo)}</span>${a.stato === 'proposto' ? '<span class="tag att">Da confermare</span>' : ''}</span><span class="freccia">${I.freccia}</span></button></li>`; };

	return testa('Oggi', `${giornoLungo(OGGI).charAt(0).toUpperCase() + giornoLungo(OGGI).slice(1)} · ${io().nome}`, tastoCerca(), true)
		+ `<div class="due"><div>${hero}${mie.filter((a) => a !== prossimo).length ? `<section class="riquadro"><h2>Poi oggi <span class="conta">${mie.length - 1}</span></h2><ul class="lista">${mie.filter((a) => a !== prossimo).map(riga).join('')}</ul></section>` : ''}</div>
		<div><section class="riquadro"><h2>Da portare <span class="conta">${portare.length || ''}</span></h2>${portare.length ? `<ul class="lista">${portare.map((m) => rigaMat(m, true)).join('')}</ul>` : '<p class="vuoto">Niente da ritirare per oggi e domani.</p>'}</section>
		<section class="riquadro"><h2>Domani <span class="conta">${domani.length || ''}</span></h2>${domani.length ? `<ul class="lista">${domani.map(riga).join('')}</ul>` : '<p class="vuoto">Niente in agenda per te.</p>'}</section></div></div>`;

function preparaErica(id, tipo) {
	const p = pratica(id), nome = p.nome.split(' ')[0], pv = prevCorrente(id), prossimo = appDi(id).find((a) => aperte(a) && a.giorno >= OGGI);
	let e;
	if (tipo === 'messaggio') {
		const testo = prossimo
			? `Buongiorno ${nome}, sono Fabri di ArtigianaMente. Le confermo ${NOMI_TIPO[prossimo.tipo].toLowerCase()} ${prossimo.giorno === OGGI ? 'oggi' : giornoLungo(prossimo.giorno)} alle ${prossimo.inizio} in ${prossimo.luogo}. Viene ${prossimo.chi.map(nomeOp).join(' e ')}. Per qualsiasi cosa mi scriva qui. Grazie!`
			: pv?.stato === 'pronta' ? `Buongiorno ${nome}, sono Fabri di ArtigianaMente. Le mando il preventivo ${pv.numero} per ${p.servizio.toLowerCase()}: lo trova in allegato. Se vuole cambiare qualcosa ne parliamo volentieri.`
			: pv?.stato === 'inviata' ? `Buongiorno ${nome}, le scrivo per il preventivo ${pv.numero} che le abbiamo mandato ${quando(pv.inviato)}. Se ha domande o vuole cambiare qualcosa sono a disposizione. Fabri, ArtigianaMente`
			: `Buongiorno ${nome}, sono Fabri di ArtigianaMente. Grazie per la richiesta per ${p.servizio.toLowerCase()} a ${p.comune}. Quando le va bene un sopralluogo? Di solito passiamo in mattinata o nel primo pomeriggio.`;
		e = { tipo: 'messaggio', titolo: `Messaggio per ${p.nome}`, testo, perche: prossimo ? `C'è ${NOMI_TIPO[prossimo.tipo].toLowerCase()} ${prossimo.stato === 'proposto' ? 'proposto' : 'fissato'} ${giornoBreve(prossimo.giorno)}.` : pv ? `Preventivo ${NOMI_PREV[pv.stato].toLowerCase()}.` : 'Richiesta senza appuntamento.' };
	} else if (tipo === 'materiali') {
		e = { tipo: 'materiali', titolo: `Materiali per ${titoloLavoro(p).toLowerCase()}`, voci: (MAT_SERVIZIO[p.servizio] ?? [['Materiale da definire', '—']]).map((x) => [...x]), fornitore: 'Ferramenta Bertolin', perche: `Lista tipica per ${p.servizio.toLowerCase()}, da «${p.dettagli}».` };

		const righe = [`${titoloLavoro(p)} · ${p.nome} (${p.tel})`, `Stato: ${NOMI_STATO[p.stato]}`, prossimo ? `Prossimo: ${NOMI_TIPO[prossimo.tipo].toLowerCase()} ${giornoBreve(prossimo.giorno)} ${prossimo.inizio} (${prossimo.chi.map(nomeOp).join(', ')})` : 'Nessun appuntamento in arrivo', pv ? `Preventivo ${pv.numero ?? 'in bozza'}: ${NOMI_PREV[pv.stato].toLowerCase()}, ${euro(totali(pv).tot)}` : 'Nessun preventivo', mc.length ? `Da comprare: ${mc.map((m) => m.nome).join(', ')}` : 'Niente da comprare', p.note ? `Note: ${p.note}` : ''].filter(Boolean);
		e = { tipo: 'riassunto', titolo: `Riassunto: ${titoloLavoro(p)}`, testo: righe.join('\n') };

	Object.assign(e, { id: nuovoId('e'), praticaId: id, stato: 'da_vedere', quando: adessoIso() });
	D.erica.push(e); salva(); apriProposta(e.id);

// Domande a Erica: risposte calcolate sui dati di prova (non è un'intelligenza vera)
function chiediErica(q) {
	q = (q || '').trim(); if (!q) return;
	const t = q.toLowerCase(), r = [];
	const elenco = (apps) => apps.map((a) => { const p = a.praticaId ? pratica(a.praticaId) : null; return `${a.inizio}–${a.fine} ${p ? p.nome : a.titolo} (${NOMI_TIPO[a.tipo].toLowerCase()}, ${a.chi.map(nomeOp).join(' e ')})`; }).join('\n');
	const delGiorno = (g) => D.appuntamenti.filter((a) => a.giorno === g && aperte(a)).sort((a, b) => a.inizio.localeCompare(b.inizio));
	const idx = GIORNI.findIndex((g) => t.includes(g.slice(0, 3)));
	if (/libero|liberi|disponibil/.test(t)) {
		let g = t.includes('domani') ? piuGiorni(OGGI, 1) : OGGI;
		if (idx >= 0) for (let i = 0; i < 7; i++) if (d(piuGiorni(OGGI, i)).getUTCDay() === idx) { g = piuGiorni(OGGI, i); break; }
		r.push(`${giornoLungo(g).charAt(0).toUpperCase() + giornoLungo(g).slice(1)}:`);
		OPERATORI.forEach((o) => { const occ = delGiorno(g).filter((a) => a.chi.includes(o.id)); r.push(occ.length ? `• ${o.nome}: occupato ${occ.map((a) => `${a.inizio}–${a.fine}`).join(', ')}` : `• ${o.nome}: libero tutto il giorno`); });
	} else if (/domani/.test(t)) { const l = delGiorno(piuGiorni(OGGI, 1)); r.push(l.length ? `Domani (${giornoBreve(piuGiorni(OGGI, 1))}):\n${elenco(l)}` : 'Domani non c\'è niente in agenda.'); }
	else if (/oggi|giornata/.test(t)) { const l = delGiorno(OGGI); r.push(l.length ? `Oggi:\n${elenco(l)}` : 'Oggi non c\'è niente in agenda.'); }
	else if (/compr|material|ferrament/.test(t)) { const l = D.materiali.filter((m) => m.stato === 'da_comprare'); r.push(l.length ? `Da comprare (${l.length}):\n${l.map((m) => `• ${m.nome}, ${m.qta} · ${titoloLavoro(pratica(m.praticaId))}${m.chi ? ' · ritira ' + nomeOp(m.chi) : ''}`).join('\n')}` : 'Non manca niente da comprare.'); }
	else if (/preventiv|rispost|attesa/.test(t)) { const l = inAttesa(); r.push(l.length ? `Senza risposta:\n${l.map((x) => `• ${x.p.nome}, ${x.pv.numero}: ${giorniDa(x.pv.inviato)} giorni`).join('\n')}\nSe vuoi ti preparo un sollecito: apri la pratica e chiedi a me.` : 'Nessun preventivo in attesa.'); }
	else if (/da fare|urgent|cosa devo/.test(t)) { const l = daFare(); r.push(l.length ? l.slice(0, 5).map((x) => `• ${x.cosa}: ${x.p.nome}${x.attesa ? ' (' + x.attesa + ')' : ''}`).join('\n') : 'Niente in sospeso.'); }
	else r.push('Nel prototipo so rispondere su: oggi, domani, chi è libero un certo giorno, cosa manca da comprare, preventivi senza risposta, cosa c\'è da fare.');
	chatErica.push(['io', esc(q)], ['erica', esc(r.join('\n'))]);
	if (chatErica.length > 12) chatErica = chatErica.slice(-12);
	render();
	const c = document.getElementById('chat'); if (c) c.scrollTop = c.scrollHeight;
}
