<title>Gestione ArtigianaMente · prototipo</title>
<style>
@font-face { font-family: 'Hanken Grotesk'; font-style: normal; font-weight: 200; font-display: swap; src: url('../fonts/hanken-grotesk-latin-200-normal.woff2') format('woff2'); }
@font-face { font-family: 'Hanken Grotesk'; font-style: normal; font-weight: 300; font-display: swap; src: url('../fonts/hanken-grotesk-latin-300-normal.woff2') format('woff2'); }
@font-face { font-family: 'Hanken Grotesk'; font-style: normal; font-weight: 400; font-display: swap; src: url('../fonts/hanken-grotesk-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Hanken Grotesk'; font-style: normal; font-weight: 500; font-display: swap; src: url('../fonts/hanken-grotesk-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Hanken Grotesk'; font-style: normal; font-weight: 600; font-display: swap; src: url('../fonts/hanken-grotesk-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Hanken Grotesk'; font-style: normal; font-weight: 700; font-display: swap; src: url('../fonts/hanken-grotesk-latin-700-normal.woff2') format('woff2'); }
/* Prototipo della Gestione (B-01, v5). Una sola pagina, dati finti, nessun server.
   Impostazioni prese dal sito (src/app.css, DESIGN.md, Icon.svelte, Galleria.svelte), non a occhio:
   colori, Hanken Grotesk, pulsanti .v3-btn (52 px, angoli 10, sfumatura nera), scelte .v3-tipo (44 px, bordo #d9d9d9),
   riquadro importante .v3-prezzo (bordo + ombra, angoli 16), campi nel riquadro .v3-lato__date (etichetta 10 px maiuscola),
   contatore foto .v3-galleria__conta, intestazione .mm-header (logo 14 px spaziato 3 px, voci 12 px con riga sotto),
   icone a linea con tratto 1.3, curve e tempi delle animazioni (--molla, --scende, 400/300/250/150 ms).
   La composizione è adattata alla Gestione: liste fitte e leggibili in cantiere, barra fissa in basso sul telefono. */
:root {
	--nero: #1b1b1e; --testo: #333333; --grigio: #6b6b6b; --bordo: #cccccc; --bordo-scelta: #d9d9d9; --bordo-campo: #b0b0b0;
	--bianco: #ffffff; --chiaro: #f4f4f4; --fondo: #f6f6f5; --linea: #dddddd;
	/* SCALA TIPOGRAFICA come Airbnb (14/10, stessi nomi del sito: src/app.css «SCALA TIPOGRAFICA»).
	   Misure di airbnb.it × 1,05 per Hanken Grotesk; peso Airbnb 500 → 600, 600 → 700. Si cambia solo qui. */
	--t-hero: 34px; --lh-hero: 38px; /* solo «Chi sei?» */
	--t-cifra: 40px; --lh-cifra: 44px; /* solo l'ora grande del prossimo appuntamento */
	--t-titolo: 27px; --lh-titolo: 32px; /* titolo della schermata — Airbnb h1 26/500/30 */
	--t-sezione: 23px; --lh-sezione: 27px; /* titolo di sezione — Airbnb h2 22/500/26 */
	--t-sotto: 19px; --lh-sotto: 25px; /* titolo di un blocco o di un passo — Airbnb 18/500/24 */
	--t-testo: 17px; --lh-testo: 23px; --lh-lungo: 25px; /* testo — Airbnb 16/400/22 */
	--t-nome: 17px; --lh-nome: 21px; /* nomi, voci con icona, pulsanti — Airbnb 16/500/20 */
	--t-scheda: 16px; --lh-scheda: 20px; /* righe di elenco: nome, dettagli, importo — Airbnb 15/500/19 */
	--t-piccolo: 15px; --lh-piccolo: 21px; --lh-piccolo-stretto: 19px; /* punti in evidenza, note, valori — Airbnb 14 */
	--t-mini: 13px; --lh-mini: 17px; /* didascalie, barra in basso — Airbnb 12/16 */
	--t-etichetta: 11.5px; --lh-etichetta: 14px; /* «CHECK-IN» — Airbnb 10/700 */
	--t-prezzo: 23px; --lh-prezzo: 27px; /* prezzo o totale principale — Airbnb «Da 317 € in totale» 22/500 */
	--w-testo: 400; --w-titolo: 600; --w-nome: 600; --w-etichetta: 700;
	--ls-titolo: -0.01em; --ls-sezione: -0.02em; --ls-etichetta: 0.04em;
	/* SPAZI come Airbnb */
	--sp-sezione: 48px; --sp-sezione-piccola: 32px; --sp-titolo: 24px; --sp-sotto: 4px;
	--lato: 372px; --contenuto: 1120px;
	--ombra: 0 1px 2px rgba(0, 0, 0, 0.06), 0 6px 20px rgba(0, 0, 0, 0.08);
	--ombra-card: 0 6px 16px rgba(0, 0, 0, 0.12);
	--nero-sfumato: linear-gradient(180deg, #2d2d30 0%, #1b1b1e 55%, #111112 100%);
	/* COLORE (14/10, come Airbnb: pochi colori, ognuno dice qualcosa) */
	--primario: #b4452c; /* pulsante principale: terracotta, come il rosa di «Scegli stanza» */
	--primario-sfumato: linear-gradient(90deg, #c8553a 0%, #b4452c 55%, #a33a2a 100%);
	--buona: #1f7a3a; --buona-f: #e4f2e8; /* verde = buona notizia, come «+ 38 € di credito» */
	/* icone colorate: i colori dei servizi dei social (social/linee.html), un po' più scuri per leggersi */
	--c-blu: #3d6ea8; --cf-blu: #eaf1fa; --c-verde: #3c7a55; --cf-verde: #e6f2ea; --c-viola: #5d4fae; --cf-viola: #efecf9;
	--c-ocra: #9c6a10; --cf-ocra: #fbf1dc; --c-rosa: #b0465f; --cf-rosa: #f9e8ed; --c-arancio: #b55e2b; --cf-arancio: #fbece2;
	--c-ardesia: #4e5d6f; --cf-ardesia: #eceff3; --c-rosso: #b3261e; --cf-rosso: #fbe4e2;
	--rosso-notifica: #ff3040; --ok: #1f7a3a; --ok-f: #e4f2e8; --att: #a85d12; --att-f: #fbeedb; --err: #b3261e; --err-f: #fbe4e2; --prop: #2f4a8a; --prop-f: #e6ebf5;
	--font: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
	--ease-out: cubic-bezier(0.23, 1, 0.32, 1);
	--molla: cubic-bezier(0.32, 0.72, 0, 1); --molla-morbida: cubic-bezier(0.22, 1, 0.36, 1); --scende: cubic-bezier(0.4, 0, 0.7, 0.8);
	--t-tendina: 400ms; --t-chiudi: 300ms; --t-passo: 250ms; --t-rapido: 150ms; --t-breve: 200ms;
	--r: 14px; --rb: 10px; --rt: 6px; --barra-h: 64px; --proto-h: 28px; --hh: 64px;
	color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bianco); color: var(--testo); font-family: var(--font); -webkit-font-smoothing: antialiased; font-size: var(--t-testo); line-height: var(--lh-testo); font-weight: var(--w-testo); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
a, button, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
h1 { color: var(--nero); text-wrap: balance; font-size: var(--t-titolo); line-height: var(--lh-titolo); font-weight: var(--w-titolo); letter-spacing: var(--ls-titolo); }
h2 { color: var(--nero); font-size: var(--t-sezione); line-height: var(--lh-sezione); font-weight: var(--w-titolo); letter-spacing: var(--ls-sezione); }
h3 { color: var(--nero); font-size: var(--t-sotto); line-height: var(--lh-sotto); font-weight: var(--w-titolo); letter-spacing: 0; }
a { color: inherit; }
img { display: block; max-width: 100%; }
.num { font-variant-numeric: tabular-nums; }
::selection { background: var(--nero); color: var(--bianco); }
:focus-visible { outline: 2px solid var(--nero); outline-offset: 2px; border-radius: 8px; }
b, strong { color: var(--nero); font-weight: var(--w-nome); }
small { font-size: var(--t-mini); }

/* marchio del sito: ARTIGIANA pieno, MENTE leggero, lettere spaziate */
.marchio { font-weight: 600; letter-spacing: 3px; font-size: 14px; line-height: 1; text-transform: uppercase; color: var(--nero); white-space: nowrap; }
.marchio span { font-weight: 200; }

/* scritta fissa del prototipo */
.proto { position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: calc(var(--proto-h) + env(safe-area-inset-top, 0px)); padding: calc(6px + env(safe-area-inset-top, 0px)) 16px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--nero); color: #fff; letter-spacing: 0.3px; text-align: center; font-size: var(--t-mini); line-height: var(--lh-mini); font-weight: var(--w-testo); }
.proto b { font-weight: var(--w-nome); color: #fff; }
.rete { position: fixed; top: calc(var(--proto-h) + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 49; padding: 8px 16px; background: #fff4e5; color: #6b3d00; border-bottom: 1px solid #f0d9b5; display: flex; gap: 10px; align-items: center; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }

/* struttura a telefono */
.app { max-width: 520px; margin: 0 auto; min-height: 100%; padding: calc(var(--proto-h) + 10px + env(safe-area-inset-top, 0px)) 20px calc(var(--barra-h) + 24px + env(safe-area-inset-bottom, 0px)); }
.app.con-rete { padding-top: calc(var(--proto-h) + 64px + env(safe-area-inset-top, 0px)); }
.schermo { animation: entra var(--t-passo) var(--ease-out); }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } }
.testa { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 0 18px; }
.testa > div:first-child { flex: 1 1 160px; min-width: 0; }
.testa .sotto { color: var(--grigio); margin-top: var(--sp-sotto); font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.testa .marchio { display: block; margin-bottom: 14px; font-size: 12px; }
.indietro { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 12px 0 0; margin-left: -6px; color: var(--grigio); font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-nome); }
.indietro svg { width: 22px; height: 22px; }

/* icone: stesso stile del sito (tratto 1.3, angoli tondi) */
svg.ico { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.3; width: 22px; height: 22px; flex: none; }
svg.ico path { vector-effect: non-scaling-stroke; }

/* barra delle sezioni: sul telefono fissa in basso, bianca, icona + nome per tutte e cinque */
.barra { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: var(--bianco); border-top: 1px solid var(--linea); padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px)); }
.barra nav { max-width: 520px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; }
.barra nav button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; padding: 7px 0 5px; border-radius: var(--rb); color: var(--grigio); position: relative; transition: color 160ms ease; font-size: var(--t-mini); line-height: var(--lh-mini); font-weight: var(--w-testo); }
.barra nav button svg { width: 24px; height: 24px; }
.barra nav button.attiva { color: var(--nero); font-weight: var(--w-nome); }
.barra nav button svg.nav-i { width: 24px; height: 24px; overflow: visible; }
.barra nav button::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; background: currentColor; transform: scaleX(0); transition: transform 220ms var(--ease-out); }
.barra nav button.attiva::after { transform: scaleX(1); }
.barra .pallino { position: absolute; top: 3px; right: calc(50% - 24px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--rosso-notifica); border: 2px solid #fff; color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.barra .marchio-barra, .barra .barra-destra, .barra .solo-largo { display: none; }
.barra .barra-destra .et-nome { display: none; }

/* sezioni: fondo bianco, righe sottili; i riquadri solo per quello che conta */
.foglio { margin-bottom: 8px; }
.sez { padding: var(--sp-sezione) 0; border-top: 1px solid var(--linea); }
.sez:first-child { border-top: 0; padding-top: 6px; }
.sez > h2 { margin-bottom: var(--sp-titolo); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sez > h2 .conta { color: var(--grigio); font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.sez > h2 .link { font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-nome); }
.riquadro { padding: var(--sp-sezione-piccola) 0; border-top: 1px solid var(--linea); }
.riquadro:first-child { border-top: 0; }
.riquadro > h2 { margin-bottom: var(--sp-titolo); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.riquadro > h2 .conta { color: var(--grigio); font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.card { border: 1px solid #dddddd; border-radius: 16px; background: var(--bianco); box-shadow: var(--ombra); padding: 18px 20px; }
.etichetta { display: block; text-transform: uppercase; color: var(--grigio); font-size: var(--t-etichetta); line-height: var(--lh-etichetta); font-weight: var(--w-etichetta); letter-spacing: var(--ls-etichetta); }

/* liste: nomi, orari, importi e stati ben leggibili; il secondario in #333, mai troppo chiaro */
.lista { list-style: none; margin: 0; padding: 0; }
.lista li + li { border-top: 1px solid var(--linea); }
.riga { width: 100%; text-align: left; background: none; border: 0; padding: 14px 0; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; color: var(--testo); }
.riga .ora { min-width: 52px; color: var(--nero); font-size: var(--t-nome); line-height: var(--lh-nome); font-weight: var(--w-nome); }
.riga .ora small { display: block; color: var(--grigio); margin-top: 2px; font-size: var(--t-mini); line-height: var(--lh-mini); font-weight: var(--w-testo); }
.riga .cosa { min-width: 0; }
.riga .cosa b { display: block; color: var(--nero); font-size: var(--t-scheda); line-height: var(--lh-scheda); font-weight: var(--w-nome); }
.riga .cosa span { display: block; color: var(--testo); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; font-size: var(--t-scheda); line-height: var(--lh-scheda); font-weight: var(--w-testo); }
.riga .cosa span.tag { display: inline-flex; margin-top: 6px; }
.riga .cosa b span.tag { margin: 0 0 0 6px; vertical-align: middle; }
.riga .freccia { color: var(--bordo); }
.riga .freccia svg { width: 20px; height: 20px; }
.riga .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--nero); }
.riga.urgente .punto { background: var(--att); }
.riga.con-mini { grid-template-columns: 60px 1fr auto; }
.vedi { display: inline-flex; align-items: center; justify-content: center; width: auto; margin-top: 16px; min-height: 48px; padding: 0 24px; border-radius: 8px; border: 0; background: #f2f2f2; color: var(--nero); text-align: center; cursor: pointer; font-size: var(--t-nome); line-height: var(--lh-nome); font-weight: var(--w-nome); }
.vuoto { color: var(--grigio); padding: 6px 0; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.nota { color: var(--grigio); font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: var(--rt); background: var(--chiaro); color: var(--testo); white-space: nowrap; font-size: var(--t-mini); line-height: var(--lh-mini); font-weight: var(--w-nome); }
.tag.ok { background: var(--ok-f); color: var(--ok); }
.tag.att { background: var(--att-f); color: var(--att); }
.tag.err { background: var(--err-f); color: var(--err); }
.tag.prop { background: var(--prop-f); color: var(--prop); }
.tag.pieno { background: var(--nero); color: #fff; }

/* scelte a bottone come nel sito (.v3-tipo): 44 px, bordo #d9d9d9, la scelta attiva è nera */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button, .scelte label { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 14px; border: 1px solid var(--bordo-scelta); border-radius: var(--rb); background: var(--bianco); color: var(--nero); white-space: nowrap; transition: border-color 160ms ease, background-color 160ms ease, color 160ms ease, transform 160ms var(--ease-out); font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.chips button:active, .scelte label:active { transform: scale(0.97); }
.chips button span { color: var(--grigio); font-weight: var(--w-testo); }
.chips button.attivo, .scelte label:has(input:checked) { background: var(--nero); border-color: var(--nero); color: #fff; }
.chips button.attivo span { color: #cfcfcf; }
.scelte { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.scelte label svg { width: 20px; height: 20px; }
.scelte input { position: absolute; opacity: 0; width: 0; height: 0; }
.cerca { width: 100%; font: inherit; min-height: 52px; padding: 0 18px; border-radius: 26px; border: 1px solid var(--bordo-scelta); background: var(--bianco); margin-bottom: 12px; box-shadow: var(--ombra); font-size: var(--t-testo); line-height: var(--lh-testo); font-weight: var(--w-testo); letter-spacing: 0; }
.cerca:focus { outline: 2px solid var(--nero); outline-offset: 0; }

/* pulsanti come nel sito (.v3-btn): 52 px, angoli 10, sfumatura nera, testo 16 px peso 500 */
.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 24px; border: 1px solid transparent; border-radius: var(--rb); background-color: var(--primario); background-image: var(--primario-sfumato); background-origin: border-box; color: #fff; font: inherit; text-decoration: none; cursor: pointer; transition: transform 160ms var(--ease-out), filter var(--t-rapido) ease; font-size: var(--t-nome); line-height: var(--lh-nome); font-weight: var(--w-nome); }
.btn:active { transform: scale(0.97); filter: brightness(0.9); }
@media (hover: hover) and (pointer: fine) { .btn:not(.linea):not(.grigio):not(.pericolo):hover { filter: brightness(1.18); } }
.btn.linea { background: transparent; border-color: var(--nero); color: var(--nero); }
.btn.grigio, .btn.tinta { background: var(--bianco); border-color: var(--bianco); color: var(--nero); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.btn.piccolo { min-height: 44px; padding: 0 16px; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-nome); }
.btn.pieno { width: 100%; }
.btn:not(.linea):not(.grigio):not(.tinta):not(.pericolo):not(.piccolo) { border-radius: 999px; }
.btn.pericolo { background: var(--bianco); color: var(--err); border-color: #e3b7b4; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn svg { width: 20px; height: 20px; }
.azioni { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--nero); text-decoration: underline; text-underline-offset: 3px; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-nome); }
.proposta { opacity: 0.85; }

/* Oggi: il prossimo appuntamento nel riquadro importante del sito (bordo + ombra) */
.prossimo { border: 1px solid #dddddd; border-radius: 16px; background: var(--bianco); box-shadow: var(--ombra-card); padding: 18px 20px 20px; margin: 4px 0 20px; }
.prossimo small { display: block; text-transform: uppercase; color: var(--grigio); margin-bottom: 6px; font-size: var(--t-etichetta); line-height: var(--lh-etichetta); font-weight: var(--w-etichetta); letter-spacing: var(--ls-etichetta); }
.prossimo .ora-grande { color: var(--nero); font-size: var(--t-cifra); line-height: var(--lh-cifra); font-weight: var(--w-titolo); letter-spacing: var(--ls-sezione); }
.prossimo .ora-grande em { font-style: normal; letter-spacing: 0; color: var(--grigio); margin-left: 10px; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.prossimo b { display: block; margin-top: 10px; font-size: var(--t-sotto); line-height: var(--lh-sotto); font-weight: var(--w-titolo); letter-spacing: 0; }
.prossimo .dett { display: block; color: var(--testo); margin-top: 2px; font-size: var(--t-testo); line-height: var(--lh-testo); font-weight: var(--w-testo); }
.prossimo .azioni { margin-top: 16px; }
.prossimo .azioni .btn { flex: 1; }
.attesa { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; width: 100%; text-align: left; background: none; border: 0; color: var(--testo); }
.attesa + .attesa { border-top: 1px solid var(--linea); }
.attesa b { display: block; font-size: var(--t-scheda); line-height: var(--lh-scheda); font-weight: var(--w-nome); }
.attesa span { color: var(--testo); display: block; font-size: var(--t-scheda); line-height: var(--lh-scheda); font-weight: var(--w-testo); }
.attesa .giorni { color: var(--grigio); white-space: nowrap; font-size: var(--t-mini); line-height: var(--lh-mini); font-weight: var(--w-testo); }
.attesa .giorni b { display: inline; font-size: var(--t-sotto); line-height: var(--lh-sotto); font-weight: var(--w-titolo); letter-spacing: 0; }
.vuoto-grande { text-align: center; padding: 28px 16px; color: var(--grigio); }
.vuoto-grande svg { width: 36px; height: 36px; margin: 0 auto 10px; }
.vuoto-grande b { display: block; margin-bottom: 4px; font-weight: var(--w-nome); }

/* scheda pratica: foto contenuta col contatore del sito, titolo leggero, stato, poi il passo principale */
.testata { margin-bottom: 16px; }
.testata .copertina-p { position: relative; border-radius: var(--r); overflow: hidden; background: var(--chiaro); aspect-ratio: 16 / 8; max-height: 180px; margin: 12px 0 14px; }
.testata .copertina-p img { width: 100%; height: 100%; object-fit: cover; }
.testata .copertina-p button { position: absolute; inset: 0; width: 100%; border: 0; background: none; padding: 0; }
.testata .copertina-p .quante { position: absolute; right: 12px; bottom: 12px; padding: 4px 10px; border-radius: var(--rt); background: rgba(0, 0, 0, 0.55); color: #fff; font-variant-numeric: tabular-nums; pointer-events: none; display: inline-flex; gap: 6px; align-items: center; font-size: var(--t-mini); line-height: var(--lh-mini); font-weight: var(--w-nome); }
.testata .copertina-p .quante svg { width: 14px; height: 14px; }
.testata .codice { color: var(--testo); margin-top: 6px; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.testata .stati { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.principale { border: 1px solid #dddddd; border-radius: 16px; background: var(--bianco); box-shadow: var(--ombra); padding: 16px 20px 18px; margin-bottom: 20px; }
.principale .motivo { color: var(--nero); margin: 4px 0 12px; font-size: var(--t-testo); line-height: var(--lh-testo); font-weight: var(--w-testo); }
.principale .btn { width: 100%; }
.principale .solo-testo { color: var(--nero); margin-top: 4px; font-size: var(--t-nome); line-height: var(--lh-nome); font-weight: var(--w-nome); }
.contatti { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: var(--t-nome); line-height: var(--lh-nome); font-weight: var(--w-testo); }
.contatti span { display: inline-flex; gap: 7px; align-items: center; }
.contatti a { text-decoration: none; color: var(--nero); font-weight: var(--w-nome); }
.coppia { display: grid; grid-template-columns: 118px 1fr; gap: 8px 12px; margin: 0; font-size: var(--t-testo); line-height: var(--lh-testo); font-weight: var(--w-testo); }
.coppia dt { color: var(--grigio); }
.coppia dd { margin: 0; color: var(--testo); }
.coppia dd .tag { vertical-align: middle; }
.stima { color: var(--nero); font-size: var(--t-prezzo); line-height: var(--lh-prezzo); font-weight: var(--w-titolo); letter-spacing: var(--ls-sezione); }
.versione { border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px; margin-top: 10px; }
.versione .testa-v { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.versione .testa-v b { font-size: var(--t-nome); line-height: var(--lh-nome); font-weight: var(--w-nome); }
.storico { list-style: none; margin: 0; padding: 0; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.storico li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--linea); }
.storico li:first-child { border-top: 0; }
.storico .q { color: var(--grigio); }
textarea.campo, input.campo, select.campo { width: 100%; font: inherit; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--bordo-campo); background: var(--bianco); margin-top: 6px; color: var(--nero); font-size: var(--t-testo); line-height: var(--lh-testo); font-weight: var(--w-testo); letter-spacing: 0; }
textarea.campo { resize: vertical; line-height: var(--lh-lungo); }
textarea.campo:focus, input.campo:focus, select.campo:focus { outline: 2px solid var(--nero); outline-offset: -1px; }
label.campo { display: block; color: var(--grigio); margin-top: 14px; font-size: var(--t-piccolo); line-height: var(--lh-piccolo); font-weight: var(--w-nome); letter-spacing: 0; }
label.campo > span.etichetta { margin-bottom: 2px; }
/* campi affiancati nello stesso riquadro, come nel sito (etichetta maiuscola piccola, valore sotto) */
.campi-box { display: grid; grid-template-columns: 1fr 1fr; margin-top: 14px; overflow: hidden; border: 1px solid var(--bordo-campo); border-radius: 12px; }
.campi-box.tre { grid-template-columns: 1.3fr 1fr 1fr; }
.campi-box label { display: grid; gap: 2px; min-height: 58px; padding: 9px 12px; background: var(--bianco); text-transform: uppercase; color: var(--nero); font-size: var(--t-etichetta); line-height: var(--lh-etichetta); font-weight: var(--w-etichetta); letter-spacing: var(--ls-etichetta); }
.campi-box label + label { border-left: 1px solid var(--bordo-campo); }
.campi-box input { width: 100%; min-width: 0; border: 0; padding: 0; margin: 0; font: inherit; text-transform: none; color: var(--nero); background: transparent; font-size: var(--t-testo); line-height: var(--lh-testo); font-weight: var(--w-testo); letter-spacing: 0; }
.campi-box input:focus { outline: none; }
.campi-box label:focus-within { background: #f7f7f7; }
.avviso { padding: 12px 14px; border-radius: 12px; margin-top: 12px; font-size: var(--t-piccolo); line-height: var(--lh-piccolo); font-weight: var(--w-testo); }
.avviso.ok { background: var(--ok-f); color: var(--ok); }
.avviso.err { background: var(--err-f); color: var(--err); }
.avviso.att { background: var(--att-f); color: #6b3d00; }

/* fotografie (dimostrative, da sostituire: cartella foto/, elenco in Altro → Foto dimostrative) */
.mini { width: 60px; height: 60px; border-radius: var(--rb); object-fit: cover; background: var(--chiaro); flex: none; }
.mini-vuota { width: 60px; height: 60px; border-radius: var(--rb); background: var(--chiaro); display: grid; place-items: center; color: var(--bordo); flex: none; }
.galleria { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.galleria button { position: relative; padding: 0; border: 0; background: var(--chiaro); border-radius: var(--rb); overflow: hidden; aspect-ratio: 1; }
.galleria img { width: 100%; height: 100%; object-fit: cover; }
.galleria .piu { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.55); color: #fff; font-size: var(--t-sotto); line-height: var(--lh-sotto); font-weight: var(--w-titolo); letter-spacing: 0; }
.didascalia { color: var(--grigio); margin-top: 8px; font-size: var(--t-mini); line-height: var(--lh-mini); font-weight: var(--w-testo); }
.copertina { width: 100%; aspect-ratio: 16 / 8; max-height: 180px; object-fit: cover; border-radius: var(--r); margin-bottom: 14px; }
.visore { position: fixed; inset: 0; z-index: 80; background: #000; color: #fff; display: flex; flex-direction: column; animation: sfuma var(--t-tendina) var(--molla); touch-action: pan-y; }
.visore.via { animation: sfuma-via var(--t-passo) ease forwards; }
.visore .vt { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; font-variant-numeric: tabular-nums; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.visore .vt button { background: rgba(255, 255, 255, 0.92); border: 0; color: var(--nero); min-height: 36px; padding: 0 14px; border-radius: 18px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-nome); }
.visore .vimg { flex: 1; display: grid; place-items: center; min-height: 0; padding: 0 8px; }
.visore .vimg img { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 6px; }
.visore .vb { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); color: #bbb; font-size: var(--t-mini); line-height: var(--lh-mini); font-weight: var(--w-testo); }
.visore .vb button { background: rgba(255, 255, 255, 0.92); border: 0; color: var(--nero); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); transition: transform 160ms var(--ease-out); }
.visore .vb button:active { transform: scale(0.94); }
.visore .vb button[disabled] { visibility: hidden; }

/* preventivo: voci */
.voce { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 8px; align-items: center; padding: 12px 0; border-top: 1px solid var(--linea); }
.voce:first-child { border-top: 0; }
.voce input:first-child { grid-column: 1 / -1; }
.voce input.campo { margin: 0; min-height: 44px; padding: 8px 12px; font-size: var(--t-testo); line-height: var(--lh-testo); font-weight: var(--w-testo); letter-spacing: 0; }
.voce .togli { width: 40px; height: 44px; border: 0; background: none; color: var(--grigio); border-radius: var(--rb); display: grid; place-items: center; }
.voce .togli:hover { background: var(--err-f); color: var(--err); }
.voce.sola-lettura { grid-template-columns: 1fr auto auto; padding: 10px 0; color: var(--testo); font-size: var(--t-scheda); line-height: var(--lh-scheda); font-weight: var(--w-testo); }
.voce.sola-lettura .q { color: var(--grigio); font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.intest-voci { display: none; }
.totali { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--linea); align-items: center; color: var(--testo); font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.totali b { font-size: var(--t-prezzo); line-height: var(--lh-prezzo); font-weight: var(--w-titolo); letter-spacing: var(--ls-sezione); }
.righe { width: 100%; border-collapse: collapse; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.righe td { padding: 8px 0; border-top: 1px solid var(--linea); vertical-align: top; }
.righe td:last-child { text-align: right; white-space: nowrap; }

/* agenda: striscia dei giorni sul telefono, impegni con inizio, fine e durata */
.agenda-testa { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.agenda-testa .tondo { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--bianco); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); display: grid; place-items: center; color: var(--nero); transition: transform 160ms var(--ease-out); }
.agenda-testa .tondo:active { transform: scale(0.94); }
.agenda-testa .titolo { flex: 1; text-align: center; color: var(--nero); font-size: var(--t-nome); line-height: var(--lh-nome); font-weight: var(--w-nome); }
.giorni-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
.giorni-strip button { border: 0; background: none; padding: 6px 0 8px; border-radius: var(--rb); display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--grigio); font-size: var(--t-mini); line-height: var(--lh-mini); font-weight: var(--w-testo); }
.giorni-strip button b { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--nero); transition: background-color 160ms ease, color 160ms ease; font-size: var(--t-nome); line-height: var(--lh-nome); font-weight: var(--w-nome); }
.giorni-strip button.oggi-g b { box-shadow: inset 0 0 0 1.5px var(--nero); }
.giorni-strip button.attivo b { background: var(--nero); color: #fff; box-shadow: none; }
.giorni-strip button i { width: 5px; height: 5px; border-radius: 50%; background: var(--nero); }
.giorni-strip button i.vuoto { background: transparent; }
.giorni-strip button.festivo { color: var(--bordo); }
.giorni-strip button.festivo b { color: var(--grigio); }
.impegno-r { width: 100%; text-align: left; background: none; border: 0; padding: 14px 0; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: stretch; color: var(--testo); }
.impegno-r .quando { display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
.impegno-r .quando b { font-size: var(--t-nome); line-height: var(--lh-nome); font-weight: var(--w-nome); }
.impegno-r .quando span { color: var(--grigio); margin-top: 2px; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.impegno-r .blocco { border-left: 3px solid var(--nero); padding-left: 12px; min-width: 0; }
.impegno-r .blocco.proposto { border-left-color: var(--att); }
.impegno-r .blocco.svolto { border-left-color: var(--bordo); }
.impegno-r .blocco.altro { border-left-color: var(--bordo); }
.impegno-r .blocco b { display: block; font-size: var(--t-scheda); line-height: var(--lh-scheda); font-weight: var(--w-nome); }
.impegno-r .blocco span { display: block; color: var(--testo); font-size: var(--t-scheda); line-height: var(--lh-scheda); font-weight: var(--w-testo); }
.impegno-r .blocco .durata { color: var(--grigio); font-size: var(--t-mini); line-height: var(--lh-mini); font-weight: var(--w-testo); }
.impegno-r .freccia { color: var(--bordo); align-self: center; }
.giorno-libero { color: var(--grigio); padding: 24px 0; text-align: center; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.settimana { display: none; }

/* tendina: sale dal basso come nel sito (molla), chiude con --scende; titolo e X */
.velo { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.42); animation: sfuma var(--t-tendina) var(--molla); }
.velo.via { animation: sfuma-via var(--t-chiudi) var(--scende) forwards; }
.tendina { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-width: 520px; margin: 0 auto; max-height: 90%; overflow: auto; background: var(--bianco); border-radius: 16px 16px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px)); animation: sale var(--t-tendina) var(--molla); box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.12); }
.tendina.via { animation: scende var(--t-chiudi) var(--scende) forwards; }
.tendina .maniglia { width: 36px; height: 4px; border-radius: 2px; background: #d9d9d9; margin: 0 auto 12px; }
.tendina .testa-t { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px; }
.tendina .chiudi-x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--bianco); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); display: grid; place-items: center; flex: none; margin-right: -4px; color: var(--nero); }
.tendina .chiudi-x svg { width: 18px; height: 18px; }
.tendina h3 { margin-bottom: 2px; }
.tendina .azioni { margin-top: 18px; }
.tendina .azioni .btn.pieno + .btn.pieno { margin-top: 2px; }
@keyframes sale { from { transform: translateY(100%); } }
@keyframes scende { to { transform: translateY(100%); } }
@keyframes sfuma { from { opacity: 0; } }
@keyframes sfuma-via { to { opacity: 0; } }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--barra-h) + 20px + env(safe-area-inset-bottom, 0px)); z-index: 70; max-width: 488px; margin: 0 auto; background: var(--nero); color: #fff; padding: 13px 16px; border-radius: 12px; animation: entra var(--t-passo) var(--ease-out); box-shadow: var(--ombra-card); font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }

/* altro */
.voci { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linea); }
.voci li { border-bottom: 1px solid var(--linea); }
.voci button { width: 100%; text-align: left; background: none; border: 0; padding: 16px 0; display: flex; align-items: center; gap: 14px; color: var(--nero); font-size: var(--t-nome); line-height: var(--lh-nome); font-weight: var(--w-testo); }
.voci button .freccia { margin-left: auto; color: var(--bordo); }
.voci button span.nota { margin-left: auto; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.pdf { border: 1px solid var(--linea); border-radius: 16px; padding: 22px; font-size: 14px; line-height: 1.5; color: var(--testo); }
.pdf .marchio { font-size: 14px; letter-spacing: 4px; }
.pdf hr { border: 0; border-top: 1px solid var(--linea); margin: 14px 0; }
.pdf h3 { font-size: 20px; font-weight: 400; }
.filigrana { display: inline-block; font-size: 12px; color: var(--grigio); border: 1px dashed #ccc; padding: 2px 8px; border-radius: var(--rt); margin: 8px 0 12px; }
.passi-pdf { list-style: none; padding: 0; margin: 10px 0 0; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.passi-pdf li { display: flex; gap: 8px; align-items: center; padding: 4px 0; color: var(--grigio); }
.passi-pdf li.fatto { color: var(--nero); }
.passi-pdf li.fatto::before { content: '✓'; color: var(--ok); }
.passi-pdf li:not(.fatto)::before { content: '·'; }
.due { display: block; }


/* ---- lotti 2-4: entrata, persone, ricerca, Erica, materiali (stesso linguaggio del sito) ---- */
.entrata { max-width: 440px; margin: 0 auto; padding: 8vh 0 40px; }
.entrata .marchio { display: block; margin-bottom: 28px; }
.entrata h1 { font-size: var(--t-hero); line-height: var(--lh-hero); font-weight: var(--w-titolo); letter-spacing: var(--ls-sezione); }
.entrata .sotto { color: var(--grigio); margin: 8px 0 22px; font-size: var(--t-testo); line-height: var(--lh-testo); font-weight: var(--w-testo); }
.persona { width: 100%; display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 16px 18px; margin-bottom: 12px; background: var(--bianco); border: 1px solid #dddddd; border-radius: 16px; box-shadow: var(--ombra); transition: transform 160ms var(--ease-out), box-shadow 200ms ease; }
.persona:active { transform: scale(0.98); }
@media (hover: hover) { .persona:hover { box-shadow: var(--ombra-card); } }
.persona b { display: block; font-size: var(--t-nome); line-height: var(--lh-nome); font-weight: var(--w-nome); }
.persona span span { display: block; color: var(--testo); margin-top: 2px; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); font-weight: var(--w-testo); }
.persona .freccia { color: var(--bordo); }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--nero); background-image: var(--nero-sfumato); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 18px; flex: none; }
.avatar.chiaro { background: var(--chiaro); background-image: none; color: var(--nero); }
.avatar.erica { width: 40px; height: 40px; background: var(--chiaro); background-image: none; color: var(--nero); }
.avatar.erica svg { width: 22px; height: 22px; }
.riga > .avatar { width: 44px; height: 44px; font-size: 16px; }
.riga > .avatar.erica { width: 40px; height: 40px; }
.tondo-cerca { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bianco); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); display: grid; place-items: center; color: var(--nero); flex: none; transition: transform 160ms var(--ease-out); }
.tondo-cerca:active { transform: scale(0.94); }
.tondo-cerca.piccolo { width: 36px; height: 36px; margin-right: 8px; }
.tondo-cerca.piccolo svg { width: 18px; height: 18px; }
.gruppo-r { color: var(--grigio); margin: 14px 0 2px; font-size: var(--t-mini); line-height: var(--lh-mini); font-weight: var(--w-nome); }

.cal-nav { display: inline-flex; align-items: center; gap: 4px; }
.cal-freccia, .cal-oggi { border: 1px solid var(--linea); background: var(--bianco); border-radius: 8px; height: 32px; display: inline-grid; place-items: center; font: inherit; font-size: var(--t-piccolo); color: var(--nero); cursor: pointer; }
.cal-freccia { width: 32px; } .cal-freccia svg { width: 16px; height: 16px; }
.cal-oggi { padding: 0 12px; font-weight: var(--w-nome); }
/* griglia delle ore */
.cal-griglia { --gut: 52px; }
.cal-intesta { display: grid; grid-template-columns: var(--gut) repeat(var(--n), 1fr); border-bottom: 1px solid var(--linea); padding-bottom: 6px; }
.cal-intesta button { border: 0; background: none; font: inherit; font-size: var(--t-piccolo); color: var(--testo); padding: 4px 0; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
.cal-intesta button b { font-weight: var(--w-testo); font-size: var(--t-nome); color: var(--nero); }
.cal-intesta button.oggi b { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--rosso-notifica); color: #fff; font-weight: var(--w-nome); }
.cal-intesta button.scelto:not(.oggi) b { font-weight: var(--w-etichetta); }
.cal-corpo { position: relative; display: grid; grid-template-columns: var(--gut) 1fr; margin-top: 8px; }
.cal-ore { position: relative; }
.cal-ore span { position: absolute; right: 8px; transform: translateY(-50%); font-size: var(--t-mini); line-height: 1; color: var(--grigio); font-variant-numeric: tabular-nums; }
.cal-ore span.adesso { right: 4px; padding: 3px 5px; border-radius: 6px; background: var(--rosso-notifica); color: #fff; font-weight: var(--w-nome); z-index: 3; }
.cal-colonne { display: grid; grid-template-columns: repeat(var(--n), 1fr); background: repeating-linear-gradient(to bottom, var(--linea) 0 1px, transparent 1px var(--px-ora)); }
.cal-col { position: relative; border-left: 1px solid var(--linea); min-height: 100%; cursor: default; }
.cal-col.festa { background: rgba(0, 0, 0, 0.025); }
.cal-ev { position: absolute; overflow: hidden; text-align: left; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; border: 0; border-left: 3px solid var(--nero); border-radius: 6px; background: var(--chiaro); padding: 4px 6px; font: inherit; font-size: var(--t-mini); line-height: var(--lh-mini); color: var(--testo); cursor: pointer; z-index: 1; transition: filter var(--t-rapido) ease; }
.cal-ev:hover { filter: brightness(0.96); }
.cal-ev b { font-weight: var(--w-nome); color: var(--nero); }
.cal-ev .nm { font-weight: var(--w-nome); color: var(--nero); }
.cal-ev .tp { display: block; color: var(--grigio); }
.cal-ev .riga1 { display: block; }
.cal-ev.corto .tp { display: none; }
.cal-ev.proposto { border-left-color: var(--att); background: var(--att-f); }
.cal-ev.svolto { border-left-color: var(--bordo); opacity: 0.7; }
.cal-ev.altro { border-left-color: var(--bordo); }
.cal-ora { position: absolute; left: 0; right: 0; height: 2px; background: var(--rosso-notifica); z-index: 2; pointer-events: none; }
.cal-ora::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--rosso-notifica); }
.cal-vista-giorno .cal-griglia { margin-top: 6px; }
/* mese */
.cal-mese-testa { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-mese-testa span { text-align: right; padding: 0 8px 6px; font-size: var(--t-piccolo); color: var(--testo); }
.cal-mese-griglia { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--linea); border-left: 1px solid var(--linea); }
.cal-cella { position: relative; min-height: 104px; display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 6px; border: 0; border-right: 1px solid var(--linea); border-bottom: 1px solid var(--linea); background: var(--bianco); text-align: left; font: inherit; cursor: pointer; overflow: hidden; }
.cal-cella.festa { background: #fafafa; }
.cal-cella .n { align-self: flex-end; font-size: var(--t-nome); line-height: 28px; min-width: 28px; text-align: center; color: var(--nero); }
.cal-cella.fuori .n { color: var(--bordo); }
.cal-cella.oggi .n { border-radius: 14px; padding: 0 6px; background: var(--rosso-notifica); color: #fff; font-weight: var(--w-nome); }
.cal-cella.scelto:not(.oggi) .n { font-weight: var(--w-etichetta); }
.cal-cella.scelto { box-shadow: inset 0 0 0 2px var(--nero); }
.cal-mini-ev { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 6px; border-radius: 5px; border-left: 3px solid var(--nero); background: var(--chiaro); font-size: var(--t-mini); line-height: var(--lh-mini); color: var(--nero); }
.cal-mini-ev b { font-weight: var(--w-nome); }
.cal-mini-ev.proposto { border-left-color: var(--att); background: var(--att-f); }
.cal-mini-ev.svolto, .cal-mini-ev.altro { border-left-color: var(--bordo); }
.cal-cella .altri { font-size: var(--t-mini); color: var(--grigio); padding-left: 6px; }
.cal-cella .punto { display: none; }
/* anno */
.cal-anno { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 32px; }
.cal-anno-mese { min-width: 0; }
.pr-due.lato-agenda .pr-testo { min-width: 0; }
.cal-anno-nome { border: 0; background: none; padding: 0; font: inherit; font-size: var(--t-sotto); line-height: var(--lh-sotto); color: var(--rosso-notifica); cursor: pointer; margin-bottom: 10px; }
.cal-anno-griglia { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-anno-griglia .ln { font-size: var(--t-mini); color: var(--grigio); padding-bottom: 4px; }
.cal-anno-griglia button { border: 0; background: none; font: inherit; font-size: var(--t-mini); line-height: 26px; color: var(--nero); border-radius: 50%; cursor: pointer; position: relative; }
.cal-anno-griglia button.pieno { font-weight: var(--w-etichetta); }
.cal-anno-griglia button.oggi { background: var(--rosso-notifica); color: #fff; }
/* mini calendario a destra */
.mini-cal { margin-bottom: 16px; }
.mini-cal-testa { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: var(--t-piccolo); color: var(--nero); }
.mini-cal-testa b { font-weight: var(--w-nome); }
.mini-cal-testa button { border: 1px solid var(--linea); background: var(--bianco); border-radius: 7px; width: 28px; height: 28px; display: inline-grid; place-items: center; margin-left: 4px; cursor: pointer; color: var(--nero); }
.mini-cal-testa svg { width: 14px; height: 14px; }
.mini-cal-griglia { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
.mini-cal-griglia .ln { font-size: var(--t-mini); color: var(--grigio); padding-bottom: 2px; }
.mini-cal-griglia button { position: relative; border: 0; background: none; font: inherit; font-size: var(--t-mini); line-height: 30px; color: var(--nero); cursor: pointer; border-radius: 50%; width: 30px; height: 30px; margin: 1px auto; padding: 0; }
.mini-cal-griglia button.fuori { color: var(--bordo); }
.mini-cal-griglia button.oggi { background: var(--rosso-notifica); color: #fff; font-weight: var(--w-nome); }
.mini-cal-griglia button.scelto:not(.oggi) { background: var(--nero); color: #fff; }
.mini-cal-griglia button i { position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; opacity: 0.6; }
@media (min-width: 900px) {
	.cal-modi .solo-largo-cal { display: inline-block; }
	.cal-vista-giorno .giorni-strip { display: none; }

}
@media (max-width: 899px) {
	.mini-cal { display: none; }
	.cal-anno { grid-template-columns: repeat(2, minmax(0, 1fr)); }
	.cal-griglia { --gut: 44px; }
	.cal-cella { min-height: 52px; padding: 4px; align-items: center; }
	.cal-cella .n { align-self: center; font-size: var(--t-piccolo); }
	.cal-cella .cal-mini-ev, .cal-cella .altri { display: none; }
	.cal-cella .punto { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--nero); }
	.cal-mese-testa span { text-align: center; padding: 0 0 6px; font-size: var(--t-mini); }
	.cal-testa { padding-top: 8px; }
}
/* Ristrutturazioni: pulsante e icone marroni (colore scelto da Gian, 14/10) */
body[data-servizio="ristrutturazioni"] { --primario: #463428; --primario-sfumato: linear-gradient(90deg, #5c4535 0%, #463428 55%, #36271d 100%); }
body[data-servizio="ristrutturazioni"] svg[data-i] { --c: #463428; --cf: #efe7e0; }
.riga.questo { box-shadow: inset 3px 0 0 var(--primario); padding-left: 10px; }
.riga.questo .cosa b::after { content: ' · questo'; color: var(--grigio); font-weight: var(--w-testo); }
/* Finestra come «Mostra tutti i comfort» di Airbnb */
.vedi:hover { background: #ebebeb; }
.finestra { position: fixed; z-index: 61; left: 50%; top: 50%; width: min(904px, calc(100vw - 48px)); max-height: calc(100vh - 80px); overflow: auto; overscroll-behavior: contain; transform: translate(-50%, -50%); background: var(--bianco); border-radius: 24px; padding: 20px 28px 36px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28); animation: finEntra var(--t-tendina) var(--molla); }
.finestra.via { animation: finEsce var(--t-chiudi) ease forwards; }
@keyframes finEntra { from { opacity: 0; transform: translate(-50%, -46%); } }
@keyframes finEsce { to { opacity: 0; transform: translate(-50%, -46%); } }
.fin-x { width: 32px; height: 32px; margin-left: -6px; border: 0; border-radius: 50%; background: none; display: grid; place-items: center; color: var(--nero); cursor: pointer; }
.fin-x:hover { background: #f2f2f2; }
.fin-x svg { width: 18px; height: 18px; stroke-width: 2.2; }
.fin-titolo { margin: 36px 0 0; font-size: var(--t-titolo); line-height: var(--lh-titolo); font-weight: var(--w-titolo); letter-spacing: var(--ls-titolo); color: var(--nero); }
.fin-gruppo h3 { margin: 40px 0 0; font-size: var(--t-sotto); line-height: var(--lh-sotto); font-weight: var(--w-titolo); color: var(--nero); }
.fin-gruppo:first-of-type h3 { margin-top: 28px; }
.fin-riga { display: flex; align-items: flex-start; gap: 16px; width: 100%; padding: 24px 0; border: 0; border-bottom: 1px solid var(--linea); background: none; font: inherit; text-align: left; color: var(--nero); cursor: pointer; }
.fin-riga:hover b { text-decoration: underline; text-underline-offset: 3px; }
.fin-riga svg { width: 24px; height: 24px; flex: none; color: var(--c, var(--nero)); }
.fin-riga b { display: block; font-size: var(--t-nome); line-height: var(--lh-nome); font-weight: var(--w-testo); }
.fin-riga .d { display: block; margin-top: 4px; font-size: var(--t-piccolo); line-height: var(--lh-piccolo-stretto); color: var(--grigio); }
.finestra > .vedi { margin-top: 28px; }
@media (max-width: 743px) {
	.finestra { left: 0; right: 0; top: 24px; bottom: 0; width: auto; max-height: none; transform: none; border-radius: 16px 16px 0 0; padding: 16px 20px calc(28px + env(safe-area-inset-bottom, 0px)); animation-name: finSale; }
	.finestra.via { animation-name: finScende; }
	@keyframes finSale { from { transform: translateY(100%); } }
	@keyframes finScende { to { transform: translateY(100%); } }
	.fin-titolo { margin-top: 20px; }
}
@media (prefers-reduced-motion: reduce) { .finestra, .finestra.via { animation: none !important; } }
/* POP-UP delle schede (come Airbnb): uno sopra l'altro. Quello sotto resta visibile, un po' più piccolo e scuro */
.pop-livello { position: fixed; inset: 0; z-index: calc(54 + var(--liv, 0) * 2); pointer-events: none; }
.pop-livello > * { pointer-events: auto; }
/* velo come Airbnb (misurato 14/10): grigio scuro #222 al 40%, senza sfocatura */
.pop-velo { position: fixed; inset: 0; background: rgba(34, 34, 34, 0.4); }
.pop-livello:not(.primo) > .pop-velo { background: rgba(34, 34, 34, 0.28); }
.pop-velo.entra { animation: sfuma var(--t-tendina) var(--molla); }
.pop { position: fixed; left: 50%; top: 50%; display: flex; flex-direction: column; background: var(--bianco); border-radius: 24px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28); overflow: hidden; transform: translate(-50%, -50%); transition: transform 300ms var(--molla), filter 300ms ease; }
.pop.grande { width: min(1200px, calc(100vw - 96px)); height: calc(100vh - 64px); }
.pop.medio { width: min(960px, calc(100vw - 96px)); height: auto; max-height: calc(100vh - 96px); }
.dietro .pop { transform: translate(-50%, calc(-50% - var(--dietro) * 14px)) scale(calc(1 - var(--dietro) * 0.04)); filter: brightness(0.97); }
/* come Airbnb: il pop-up aperto da un altro è più piccolo, così quello sotto si vede intorno */
@media (min-width: 900px) {
.pop-livello:not(:first-child) .pop.grande { width: min(1060px, calc(100vw - 200px)); height: calc(100vh - 128px); }
.pop-livello:not(:first-child) .pop.medio { width: min(860px, calc(100vw - 200px)); max-height: calc(100vh - 140px); }
}
.pop-livello.dietro:not(.primo) > .pop-velo { background: transparent; }
.pop-livello.nascosto { visibility: hidden; }
.pop.entra { animation: finEntra var(--t-tendina) var(--molla); }
.pop.via, .pop-velo.via { animation: finEsce var(--t-chiudi) ease forwards; }
.pop-velo.via { animation-name: sfumaVia; }
@keyframes sfumaVia { to { opacity: 0; } }
.pop-x { position: absolute; z-index: 3; top: 16px; right: 16px; }
.pop-tondo { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--bianco); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); display: grid; place-items: center; color: var(--nero); cursor: pointer; }
.pop-tondo svg { width: 18px; height: 18px; stroke-width: 2.2; }
.pop-corpo { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 56px 40px 48px; }
.pop-schermo { max-width: var(--contenuto); margin: 0 auto; animation: none; }
.pop .pr-box-fisso { top: 16px; max-height: calc(100vh - 140px); }
.pop .pr-indietro, .pop .indietro, .pop .pv-solo-largo { display: none; }
body.con-pop { overflow: hidden; }
body.con-pop .erica-fab { visibility: hidden; }
/* piccolo riquadro (Dettagli del prezzo) */
.velo.leggero { background: rgba(0, 0, 0, 0.12); }
.rq { position: fixed; z-index: 61; left: 50%; top: 50%; width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 80px); overflow: auto; transform: translate(-50%, -50%); background: var(--bianco); border-radius: 16px; padding: 20px 24px 24px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25); animation: finEntra var(--t-passo) var(--molla); }
.rq.via { animation: finEsce var(--t-chiudi) ease forwards; }
.rq .fin-x { position: absolute; top: 12px; right: 12px; margin: 0; }
.rq-titolo { margin: 8px 0 18px; font-size: var(--t-sotto); line-height: var(--lh-sotto); font-weight: var(--w-titolo); color: var(--nero); }
.rq-riga { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; font-size: var(--t-piccolo); line-height: var(--lh-piccolo); color: var(--nero); }
.rq-riga small { color: var(--grigio); font-size: var(--t-mini); }
.rq-riga.sep { border-top: 1px solid var(--linea); margin-top: 6px; padding-top: 12px; }
.rq-riga.tot { font-weight: var(--w-nome); font-size: var(--t-nome); }
.rq-riga.grande b { font-size: var(--t-prezzo); line-height: var(--lh-prezzo); }
.rq-box { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--chiaro); font-size: var(--t-piccolo); line-height: var(--lh-piccolo); color: var(--nero); }
.rq-box svg { width: 22px; height: 22px; flex: none; color: var(--c, var(--nero)); }
.rq .vedi { margin-top: 16px; }
@media (max-width: 899px) {
	.pop.grande, .pop.medio { left: 0; right: 0; top: calc(12px + var(--vis, 0) * 10px); bottom: 0; width: auto; height: auto; max-height: none; transform: none; border-radius: 16px 16px 0 0; }
	.dietro .pop { transform: scale(calc(1 - var(--dietro) * 0.05)); transform-origin: top center; }
	.pop.entra { animation-name: finSaleP; }
	.pop.via { animation-name: finScendeP; }
	@keyframes finSaleP { from { transform: translateY(100%); } }
	@keyframes finScendeP { to { transform: translateY(100%); } }
	.pop-corpo { padding: 56px 20px calc(32px + env(safe-area-inset-bottom, 0px)); }
	.pop-x { top: 12px; right: 12px; }
}
@media (prefers-reduced-motion: reduce) { .pop, .pop-velo, .pop.via, .pop-velo.via, .rq, .rq.via { animation: none !important; transition: none !important; } }

/* numeri nei pallini rossi: centrati (riga alta quanto il carattere) */
.barra .pallino, .erica-fab .badge { line-height: 1; font-variant-numeric: tabular-nums; padding-top: 0; padding-bottom: 0; text-align: center; }
@media (min-width: 900px) { .barra .pallino { padding-top: 1px; } }
.tipo-cliente { margin-bottom: 6px; }

/* ===== POP-UP COME AIRBNB, UNA SOLA PILA (Gian 14/10) =====
   misure di airbnb.it: piccola 480 · media 568 (moduli) · lista 780 · angoli 32; fumetto 370 con angoli 24, attaccato al pulsante e senza velo */
.pop { border-radius: 32px; }
.pop.medio.lista { width: min(780px, calc(100vw - 96px)); }
@media (min-width: 900px) { .pop-livello:not(:first-child) .pop.medio.lista { width: min(740px, calc(100vw - 200px)); } }
.pop-x .ico-su, .fin-x .ico-su { display: none; }
.pop-x .ico-x, .fin-x .ico-x, .pop-x .ico-su, .fin-x .ico-su { line-height: 0; }
.fin-x svg, .pop-x svg { width: 18px; height: 18px; }
.f-fumetto > .pop-velo { background: transparent !important; }
.tendina.fermo, .finestra.fermo { animation: none !important; }
/* lista */
.finestra { width: min(780px, calc(100vw - 48px)); border-radius: 32px; padding: 24px 32px 40px; transition: transform 300ms var(--molla), filter 300ms ease; }
.dietro .finestra { transform: translate(-50%, calc(-50% - 14px)) scale(0.96); filter: brightness(0.97); }
/* moduli: sul computer al centro, pulsanti fissi in fondo (come «Filtri») */
@media (min-width: 744px) {
	.tendina { left: 50%; top: 50%; right: auto; bottom: auto; width: min(568px, calc(100vw - 48px)); max-width: none; max-height: calc(100vh - 80px); margin: 0; transform: translate(-50%, -50%); border-radius: 32px; padding: 0 24px 24px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28); animation: finEntra var(--t-tendina) var(--molla); overscroll-behavior: contain; transition: transform 300ms var(--molla), filter 300ms ease; }
	.tendina.piccola { width: min(480px, calc(100vw - 48px)); }
	.tendina.via { animation: finEsce var(--t-chiudi) ease forwards; }
	.dietro .tendina { transform: translate(-50%, calc(-50% - 14px)) scale(0.96); filter: brightness(0.97); }
	.tendina .maniglia { display: none; }
	.tendina .testa-t { position: sticky; top: 0; z-index: 2; margin: 0 -24px 16px; padding: 0 16px 0 24px; min-height: 64px; background: var(--bianco); border-bottom: 1px solid var(--linea); }
	.tendina .testa-t h3 { margin: 0; flex: 1; text-align: center; padding-left: 36px; font-size: var(--t-scheda); line-height: var(--lh-scheda); font-weight: var(--w-titolo); }
	.tendina .chiudi-x { box-shadow: none; }
	.tendina .chiudi-x:hover { background: #f2f2f2; }
	.tendina .azioni { position: sticky; bottom: -24px; z-index: 2; display: flex; flex-direction: row-reverse; justify-content: space-between; align-items: center; gap: 12px; margin: 24px -24px -24px; padding: 16px 24px; background: var(--bianco); border-top: 1px solid var(--linea); }
	.tendina .azioni .btn { width: auto; margin: 0 !important; }
	.tendina .azioni .btn.linea { border-color: transparent; background: none; text-decoration: underline; text-underline-offset: 3px; padding-left: 8px; padding-right: 8px; }
	/* fumetto attaccato al pulsante */
	.rq.ancorato { transform: none; width: min(370px, calc(100vw - 32px)); border-radius: 24px; padding: 24px; animation: fumEntra var(--t-passo) var(--molla); }
	.rq.ancorato.via { animation: fumEsce var(--t-rapido) ease forwards; }
	@keyframes fumEntra { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
	@keyframes fumEsce { to { opacity: 0; } }
}
@media (max-width: 743px) {
	/* sul telefono: grandi finestre con la freccia ← in alto; le liste lunghe entrano da destra a tutto schermo */
	.finestra { top: 0; left: 0; right: 0; bottom: 0; width: auto; transform: none; border-radius: 0; animation-name: finDestra; padding-top: 12px; }
	.finestra.via { animation-name: finDestraVia; }
	@keyframes finDestra { from { transform: translateX(100%); } }

const fotoDi = (p) => [...(Array.isArray(p.foto) ? p.foto : []), ...(p.fotoCantiere ?? []).map((f) => f.nome)];
const miniatura = (p) => { const f = fotoDi(p)[0] ?? FOTO_SERVIZIO[p.servizio]; return f ? `<img class="mini" src="${mini(f)}" alt="" loading="lazy" width="52" height="52">` : `<span class="mini-vuota">${I.pratiche}</span>`; };

let visore = null;
/* TUTTE LE FOTO come il «tour fotografico» di Airbnb: a tutto schermo, divise in gruppi (dal cliente / dal cantiere),
   tocco su una foto → visore nero sopra. Sta nella pila: X, Esc o Indietro per chiudere. */
function apriTour(praticaId) {
	const p = pratica(praticaId); if (!p || !fotoDi(p).length) return;
	const cl = Array.isArray(p.foto) ? p.foto : [], ca = p.fotoCantiere ?? [];
	const gruppi = [['Dal cliente', 'Mandate con la richiesta', cl.map((n, i) => [n, i])], ['Dal cantiere', 'Scattate dalla squadra', ca.map((x, j) => [x.nome, cl.length + j, x])]].filter((g) => g[2].length);
	const foto = ([n, i, x]) => `<button type="button" class="tour-foto" onclick="apriVisore('${p.id}',${i})" aria-label="${esc(FOTO[n]?.[0] ?? 'Foto')}"><img src="${src(n)}" alt="" loading="lazy">${x ? `<span class="tour-chi">${nomeOp(x.chi)} · ${quando(x.quando)}</span>` : ''}</button>`;
	apriFoglio('foto', 'Tutte le foto', `<div class="tour" role="dialog" aria-modal="true" aria-label="Tutte le foto · ${esc(p.nome)}"><div class="tour-testa"><button type="button" class="pop-tondo tour-x" aria-label="Chiudi" onclick="chiudiTendina()">${I.indietro}</button><span>${fotoDi(p).length} foto</span></div><div class="tour-corpo"><h2>Tutte le foto</h2><p class="nota">${esc(titoloLavoro(p))} · ${esc(p.nome)}</p>${gruppi.length > 1 ? `<div class="tour-indice">${gruppi.map(([t, , l], k) => `<button type="button" onclick="document.getElementById('tg-${k}').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })"><img src="${mini(l[0][0])}" alt=""><span>${t} · ${l.length}</span></button>`).join('')}</div>` : ''}${gruppi.map(([t, dd, l], k) => `<section class="tour-gruppo" id="tg-${k}"><div class="tour-tit"><h3>${t}</h3><p class="nota">${dd} · ${l.length}</p></div><div class="tour-griglia">${l.map(foto).join('')}</div></section>`).join('')}<p class="nota tour-did">Foto dimostrative (Pexels).</p></div></div>`);
}
function apriVisore(praticaId, i = 0) {
	const p = pratica(praticaId); if (!p || !fotoDi(p).length) return;
	visore = { p, i };
	const s = document.getElementById('visore');
	s.innerHTML = `<div class="visore" role="dialog" aria-modal="true" aria-label="Foto"><div class="vt"><span></span><button type="button" onclick="chiudiVisore()">Chiudi</button></div><div class="vimg"><img alt=""></div><div class="vb"><button type="button" aria-label="Precedente" onclick="visoreVai(-1)">${I.indietro}</button><span class="vdid"></span><button type="button" aria-label="Successiva" onclick="visoreVai(1)">${I.freccia}</button></div></div>`;
	let x0 = null;
	s.firstChild.addEventListener('touchstart', (e) => (x0 = e.touches[0].clientX), { passive: true });
	s.firstChild.addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) visoreVai(dx < 0 ? 1 : -1); x0 = null; });
	visoreMostra();
}
function visoreMostra() {
	const { p, i } = visore, f = fotoDi(p), n = f[i], s = document.getElementById('visore');
	s.querySelector('.vimg img').src = src(n);
	s.querySelector('.vt span').textContent = `${i + 1} di ${f.length} · ${esc(p.nome)}`;
	s.querySelector('.vdid').textContent = `${FOTO[n]?.[0] ?? ''} · foto dimostrativa (Pexels, ${FOTO[n]?.[1] ?? ''})`;
	s.querySelector('.vb button:first-child').disabled = i === 0;
	s.querySelector('.vb button:last-child').disabled = i === f.length - 1;
}
function visoreVai(d) { if (!visore) return; const n = visore.i + d; if (n < 0 || n >= fotoDi(visore.p).length) return; visore.i = n; visoreMostra(); }
function chiudiVisore() {
	const s = document.getElementById('visore'); if (!s.firstChild) return;
	s.firstChild.classList.add('via'); visore = null;
	setTimeout(() => (s.innerHTML = ''), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 300);
}
const galleria = (p) => {
	const f = fotoDi(p); if (!f.length) return '';
	const mostra = f.slice(0, 3);
	return `<div class="galleria">${mostra.map((n, i) => `<button type="button" onclick="${i === 2 && f.length > 3 ? `apriTour('${p.id}')` : `apriVisore('${p.id}',${i})`}" aria-label="${i === 2 && f.length > 3 ? 'Tutte le foto' : `Foto ${i + 1}`}"><img src="${mini(n)}" alt="${esc(FOTO[n]?.[0] ?? '')}" loading="lazy">${i === 2 && f.length > 3 ? `<span class="piu">+${f.length - 3}</span>` : ''}</button>`).join('')}</div><p class="didascalia">Foto dimostrative (Pexels), non lavori di ArtigianaMente. Si sostituiscono con quelle vere.</p>`;
};

const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
const GIORNI_B = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
const d = (s) => new Date(s.slice(0, 10) + 'T12:00:00Z');
const giornoLungo = (s) => { const x = d(s); return `${GIORNI[x.getUTCDay()]} ${x.getUTCDate()} ${MESI[x.getUTCMonth()]}`; };
const giornoBreve = (s) => { const x = d(s); return `${GIORNI_B[x.getUTCDay()]} ${x.getUTCDate()} ${MESI[x.getUTCMonth()].slice(0, 3)}`; };
const quando = (iso) => { if (!iso) return ''; const x = d(iso); return `${x.getUTCDate()} ${MESI[x.getUTCMonth()].slice(0, 3)}${iso.length > 10 ? ', ' + iso.slice(11, 16) : ''}`; };
const piuGiorni = (s, n) => { const x = d(s); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const lunediDi = (s) => piuGiorni(s, -((d(s).getUTCDay() + 6) % 7));
const giorniDa = (iso) => Math.round((d(OGGI) - d(iso)) / 86400000);
const euro = (n) => n.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
// totale voci − sconto = imponibile; poi IVA (lo sconto è facoltativo)
const inTotale = (r) => !(r[5]?.opzione || r[5]?.cliente || r[5]?.daQuant || r[5]?.daVer);
const totali = (p) => { const voci = Math.round(p.righe.filter(inTotale).reduce((s, r) => s + r[3], 0) * 100) / 100, sconto = Math.min(+p.sconto || 0, voci), imp = Math.round((voci - sconto) * 100) / 100, iva = Math.round(imp * p.iva) / 100; return { voci, sconto, imp, iva, tot: Math.round((imp + iva) * 100) / 100 }; };

/* ===================== AZIONE SUGGERITA ===================== */
// Solo lettura: guarda il preventivo corrente e gli appuntamenti, non cambia niente. Il motivo è sempre scritto.
// «Verifica la pratica» solo per contraddizioni concrete, con scritto cosa non torna e un tasto per andare a vedere.
function suggerita(p) {
	const apps = appDi(p.id), pvs = prevDi(p.id), pv = pvs.at(-1) ?? null;
	const futuri = apps.filter((a) => aperte(a) && a.giorno >= OGGI);
	const passatiProposti = apps.filter((a) => a.stato === 'proposto' && a.giorno < OGGI);
	const lavoroAttivo = apps.find((a) => aperte(a) && a.tipo !== 'sopralluogo' && a.tipo !== 'altro');
	const sopr = apps.filter((a) => a.tipo === 'sopralluogo');
	const soprAperto = sopr.find((a) => aperte(a) && a.giorno >= OGGI);
	const soprSvolto = sopr.some((a) => a.stato === 'svolto');
	const accettate = pvs.filter((v) => v.stato === 'accettata');
	// contraddizioni concrete
	if (p.archiviata || chiusa(p)) {
		if (futuri.length) return { testo: 'Verifica la pratica', motivo: `Pratica «${NOMI_STATO[p.stato]}», ma c'è ancora un appuntamento attivo: ${NOMI_TIPO[futuri[0].tipo].toLowerCase()} ${giornoBreve(futuri[0].giorno)} alle ${futuri[0].inizio}. Annullalo o riapri la pratica.`, azione: 'imp-' + futuri[0].id };
		return null;
	}
	if (passatiProposti.length) { const a = passatiProposti[0]; return { testo: 'Verifica la pratica', motivo: `${NOMI_TIPO[a.tipo]} del ${giornoBreve(a.giorno)} ancora «proposto»: non è stato confermato né annullato. Cosa è successo?`, azione: 'imp-' + a.id }; }
	if (pv?.stato === 'rifiutata' && lavoroAttivo) return { testo: 'Verifica la pratica', motivo: `Preventivo ${pv.numero} registrato come rifiutato, ma ${NOMI_TIPO[lavoroAttivo.tipo].toLowerCase()} ancora confermato per ${giornoBreve(lavoroAttivo.giorno)}.`, azione: 'imp-' + lavoroAttivo.id };
	if (accettate.length > 1 || (accettate.length === 1 && pv && pv.stato !== 'accettata' && pv.stato !== 'bozza' && pv.stato !== 'superata')) return { testo: 'Verifica la pratica', motivo: `${pvs.length} versioni del preventivo e non è chiaro quale valga: ${pvs.map((v) => (v.numero ?? 'bozza v' + v.n) + ' ' + NOMI_PREV[v.stato].toLowerCase()).join(', ')}.`, azione: 'prev' };
	// passi normali
	if (p.stato === 'in_corso') {
		if (lavoroAttivo) return { testo: 'Lavoro in corso', motivo: `Prossima giornata ${giornoBreve(lavoroAttivo.giorno)} alle ${lavoroAttivo.inizio}.`, azione: null };
		return { testo: 'Programma o chiudi', motivo: 'Nessuna prossima giornata pianificata. Verifica se programmare un altro intervento o aggiornare lo stato.', azione: 'nuovo-lavoro' };
	}
	if (pv?.stato === 'accettata') {
		if (lavoroAttivo?.stato === 'proposto') return { testo: 'Conferma la data del lavoro', motivo: `Preventivo accettato. Lavoro proposto per ${giornoBreve(lavoroAttivo.giorno)}, non ancora confermato.`, azione: 'imp-' + lavoroAttivo.id };
		if (lavoroAttivo) return { testo: 'Tutto programmato', motivo: `Lavoro confermato per ${giornoBreve(lavoroAttivo.giorno)} alle ${lavoroAttivo.inizio}.${p.stato !== 'programmata' ? ` Lo stato è ancora «${NOMI_STATO[p.stato]}»: aggiornalo quando vuoi.` : ''}`, azione: p.stato !== 'programmata' ? 'stato' : null };

const TIPI_CLIENTE = { privato: ['Privato', 'Nome e cognome'], azienda: ['Azienda', 'Nome dell\'azienda'], pubblico: ['Lavori pubblici', 'Ente (es. Comune di Cavallino-Treporti)'] };

function salvaCliente(id) {

	const dati = { tipo, nome: v('cl-nome'), tel: v('cl-tel'), email: v('cl-email'), indirizzo: v('cl-indirizzo'), note: v('cl-note'), piva: tipo === 'privato' ? '' : v('cl-piva'), cig: tipo === 'pubblico' ? v('cl-cig') : '', referente: tipo === 'privato' ? '' : v('cl-referente') };

function chiediErica(q) {
	q = (q || '').trim(); if (!q) return;
	const t = q.toLowerCase(), r = [];
	const elenco = (apps) => apps.map((a) => { const p = a.praticaId ? pratica(a.praticaId) : null; return `${a.inizio}–${a.fine} ${p ? p.nome : a.titolo} (${NOMI_TIPO[a.tipo].toLowerCase()}, ${a.chi.map(nomeOp).join(' e ')})`; }).join('\n');
	const delGiorno = (g) => D.appuntamenti.filter((a) => a.giorno === g && aperte(a)).sort((a, b) => a.inizio.localeCompare(b.inizio));
	const idx = GIORNI.findIndex((g) => t.includes(g.slice(0, 3)));
	if (/libero|liberi|disponibil/.test(t)) {
		let g = t.includes('domani') ? piuGiorni(OGGI, 1) : OGGI;
		if (idx >= 0) for (let i = 0; i < 7; i++) if (d(piuGiorni(OGGI, i)).getUTCDay() === idx) { g = piuGiorni(OGGI, i); break; }
		r.push(`${giornoLungo(g).charAt(0).toUpperCase() + giornoLungo(g).slice(1)}:`);
		OPERATORI.forEach((o) => { const occ = delGiorno(g).filter((a) => a.chi.includes(o.id)); r.push(occ.length ? `• ${o.nome}: occupato ${occ.map((a) => `${a.inizio}–${a.fine}`).join(', ')}` : `• ${o.nome}: libero tutto il giorno`); });
	} else if (/domani/.test(t)) { const l = delGiorno(piuGiorni(OGGI, 1)); r.push(l.length ? `Domani (${giornoBreve(piuGiorni(OGGI, 1))}):\n${elenco(l)}` : 'Domani non c\'è niente in agenda.'); }
	else if (/oggi|giornata/.test(t)) { const l = delGiorno(OGGI); r.push(l.length ? `Oggi:\n${elenco(l)}` : 'Oggi non c\'è niente in agenda.'); }
	else if (/compr|material|ferrament/.test(t)) { const l = D.materiali.filter((m) => m.stato === 'da_comprare'); r.push(l.length ? `Da comprare (${l.length}):\n${l.map((m) => `• ${m.nome}, ${m.qta} · ${titoloLavoro(pratica(m.praticaId))}${m.chi ? ' · ritira ' + (m.chi === D.utente ? 'tu' : nomeOp(m.chi)) : ''}`).join('\n')}` : 'Non manca niente da comprare.'); }
	else if (/preventiv|rispost|attesa/.test(t)) { const l = inAttesa(); r.push(l.length ? `Senza risposta:\n${l.map((x) => `• ${x.p.nome}, ${x.pv.numero}: ${giorniDa(x.pv.inviato)} giorni`).join('\n')}\nSe vuoi ti preparo un sollecito: apri la pratica e chiedi a me.` : 'Nessun preventivo in attesa.'); }

	else r.push('Nel prototipo so rispondere su: oggi, domani, chi è libero un certo giorno, cosa manca da comprare, preventivi senza risposta, cosa c\'è da fare.');

}
