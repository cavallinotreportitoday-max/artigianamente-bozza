<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b1b1e"><meta name="robots" content="noindex"><link rel="icon" href="../icone/gestione-192.png">
<title>Gestione ArtigianaMente · prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Prototipo della Gestione (B-01, v4). Una sola pagina, dati finti, nessun server.
   Identità del sito ArtigianaMente: bianco, nero #1B1B1E, Hanken Grotesk, angoli tondi, icone a linea.
   Il colore (verde/arancio/rosso) serve solo a distinguere gli stati, sempre con la parola accanto.
   Movimento: curva del sito, aperture 400 ms, chiusure 300 ms, cambio schermata 250 ms; con «Riduci movimento» niente animazioni. */
:root {
	--nero: #1b1b1e; --bianco: #ffffff; --fondo: #f4f4f2; --grigio: #6f6f6f; --grigio-chiaro: #9a9a9a; --linea: #e8e8e6; --tinta: #efefec;
	--ok: #1f7a3a; --ok-f: #e4f2e8; --att: #a85d12; --att-f: #fbeedb; --err: #b3261e; --err-f: #fbe4e2; --prop: #2f4a8a; --prop-f: #e6ebf5;
	--font: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
	--molla: cubic-bezier(.22, 1, .36, 1); --t-apri: 400ms; --t-chiudi: 300ms; --t-passo: 250ms;
	--r: 18px; --rb: 12px; --rt: 6px; --barra-h: 64px; --proto-h: 28px;
	color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--fondo); color: var(--nero); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 28px; font-weight: 500; letter-spacing: -0.5px; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 600; letter-spacing: 0; }
h3 { font-size: 18px; font-weight: 600; }
a { color: inherit; }
img { display: block; max-width: 100%; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--nero); outline-offset: 2px; }

/* marchio del sito: ARTIGIANA pieno, MENTE leggero, lettere spaziate */
.marchio { font-weight: 600; letter-spacing: 3px; font-size: 12px; text-transform: uppercase; }
.marchio span { font-weight: 300; }

/* scritta fissa del prototipo */
.proto { position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: calc(var(--proto-h) + env(safe-area-inset-top, 0px)); padding: calc(6px + env(safe-area-inset-top, 0px)) 16px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--nero); color: #fff; font-size: 12px; letter-spacing: 0.3px; text-align: center; }
.proto b { font-weight: 600; }
.rete { position: fixed; top: calc(var(--proto-h) + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 49; padding: 8px 16px; background: #fff4e5; color: #6b3d00; border-bottom: 1px solid #f0d9b5; font-size: 14px; display: flex; gap: 10px; align-items: center; }

/* struttura a telefono */
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding: calc(var(--proto-h) + 12px + env(safe-area-inset-top, 0px)) 16px calc(var(--barra-h) + 24px + env(safe-area-inset-bottom, 0px)); }
.app.con-rete { padding-top: calc(var(--proto-h) + 66px + env(safe-area-inset-top, 0px)); }
.schermo { animation: entra var(--t-passo) var(--molla); }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } }
.testa { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 10px 0 18px; }
.testa .sotto { color: var(--grigio); font-size: 15px; margin-top: 4px; }
.testa .marchio { display: block; color: var(--grigio); margin-bottom: 10px; }
.indietro { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 10px 0 2px; margin-left: -4px; color: var(--grigio); font-size: 15px; }
.indietro svg { width: 20px; height: 20px; }

/* barra delle sezioni */
.barra { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px); border-top: 1px solid var(--linea); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.barra nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.barra button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; border-radius: var(--rb); color: var(--grigio); font-size: 11px; font-weight: 500; position: relative; }
.barra button svg { width: 24px; height: 24px; stroke-width: 1.5; }
.barra button.attiva { color: var(--nero); }
.barra button.attiva svg { stroke-width: 2; }
.barra .pallino { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--nero); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.barra .marchio-barra { display: none; }
svg.ico { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.6; width: 20px; height: 20px; flex: none; }

/* fogli e sezioni: un foglio bianco, dentro sezioni separate da una riga sottile */
.foglio { background: var(--bianco); border-radius: var(--r); padding: 4px 18px; margin-bottom: 14px; }
.sez { padding: 16px 0; }
.sez + .sez { border-top: 1px solid var(--linea); }
.sez > h2 { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sez > h2 .conta { font-weight: 400; color: var(--grigio); font-size: 14px; }
.sez > h2 .link { font-size: 14px; }
.riquadro { background: var(--bianco); border-radius: var(--r); padding: 16px 18px; margin-bottom: 14px; }
.riquadro > h2 { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.riquadro > h2 .conta { font-weight: 400; color: var(--grigio); font-size: 14px; }

/* liste */
.lista { list-style: none; margin: 0; padding: 0; }
.lista li + li { border-top: 1px solid var(--linea); }
.riga { width: 100%; text-align: left; background: none; border: 0; padding: 13px 0; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.riga .ora { font-weight: 600; font-size: 16px; min-width: 50px; line-height: 1.2; }
.riga .ora small { display: block; font-weight: 400; font-size: 12px; color: var(--grigio); }
.riga .cosa { min-width: 0; }
.riga .cosa b { font-weight: 600; display: block; font-size: 16px; }
.riga .cosa span { display: block; color: var(--grigio); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.riga .cosa span.tag { display: inline-flex; margin-top: 5px; }
.riga .cosa b span.tag { margin: 0 0 0 6px; vertical-align: middle; }
.riga .freccia { color: var(--grigio-chiaro); }
.riga .freccia svg { width: 18px; height: 18px; }
.riga .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--nero); }
.riga.urgente .punto { background: var(--att); }
.riga.con-mini { grid-template-columns: 56px 1fr auto; }
.vedi { display: block; width: 100%; margin-top: 6px; padding: 11px; border-radius: var(--rb); border: 0; background: var(--tinta); font-size: 14px; font-weight: 500; color: var(--nero); text-align: center; }
.vuoto { color: var(--grigio); font-size: 15px; padding: 6px 0; }
.nota { color: var(--grigio); font-size: 14px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--tinta); color: #4a4a4a; white-space: nowrap; line-height: 1.2; }
.tag.ok { background: var(--ok-f); color: var(--ok); }
.tag.att { background: var(--att-f); color: var(--att); }
.tag.err { background: var(--err-f); color: var(--err); }
.tag.prop { background: var(--prop-f); color: var(--prop); }
.tag.pieno { background: var(--nero); color: #fff; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
.chips button { white-space: nowrap; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--linea); background: var(--bianco); font-size: 14px; }
.chips button span { color: var(--grigio); }
.chips button.attivo { background: var(--nero); border-color: var(--nero); color: #fff; }
.chips button.attivo span { color: #ccc; }
.cerca { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: var(--rb); border: 1px solid var(--linea); background: var(--bianco); margin-bottom: 10px; }

/* pulsanti */
.btn { text-decoration: none; font-weight: 600; font-size: 15px; padding: 13px 18px; border-radius: var(--rb); border: 1px solid var(--nero); background: var(--nero); color: #fff; display: inline-flex; align-items: center; gap: 8px; justify-content: center; transition: transform 150ms var(--molla); }
.btn:active { transform: scale(0.98); }
.btn.linea { background: var(--bianco); color: var(--nero); }
.btn.tinta { background: var(--tinta); border-color: var(--tinta); color: var(--nero); }
.btn.piccolo { padding: 9px 13px; font-size: 14px; }
.btn.pieno { width: 100%; }
.btn.pericolo { background: var(--bianco); color: var(--err); border-color: #e3b7b4; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.azioni { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.link { background: none; border: 0; padding: 4px 0; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }
.proposta { opacity: 0.8; }

/* Oggi */
.prossimo { background: var(--nero); color: #fff; border-radius: var(--r); padding: 18px 18px 16px; margin-bottom: 14px; }
.prossimo small { display: block; font-size: 13px; color: #b9b9b9; margin-bottom: 8px; }
.prossimo .ora-grande { font-size: 44px; font-weight: 600; letter-spacing: -1.5px; line-height: 1; }
.prossimo .ora-grande em { font-style: normal; font-size: 16px; font-weight: 400; letter-spacing: 0; color: #b9b9b9; margin-left: 10px; }
.prossimo b { display: block; font-size: 20px; font-weight: 600; margin-top: 8px; }
.prossimo .dett { display: block; color: #cfcfcf; font-size: 15px; margin-top: 2px; }
.prossimo .tag { background: rgba(255, 255, 255, 0.16); color: #fff; }
.prossimo .azioni { margin-top: 14px; }
.prossimo .btn { background: #fff; color: var(--nero); border-color: #fff; }
.prossimo .btn.linea { background: transparent; color: #fff; border-color: rgba(255, 255, 255, 0.4); }
.attesa { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; width: 100%; text-align: left; background: none; border: 0; }
.attesa + .attesa { border-top: 1px solid var(--linea); }
.attesa b { font-weight: 600; font-size: 15px; display: block; }
.attesa span { color: var(--grigio); font-size: 13px; display: block; }
.attesa .giorni { font-size: 13px; color: var(--grigio); white-space: nowrap; }
.attesa .giorni b { font-size: 18px; display: inline; color: var(--nero); }
.vuoto-grande { text-align: center; padding: 28px 16px; color: var(--grigio); }
.vuoto-grande svg { width: 36px; height: 36px; margin: 0 auto 10px; stroke-width: 1.2; }
.vuoto-grande b { display: block; color: var(--nero); font-weight: 600; margin-bottom: 4px; }

/* scheda pratica */
.testata { margin-bottom: 14px; }
.testata .copertina-p { position: relative; border-radius: var(--r); overflow: hidden; background: var(--tinta); aspect-ratio: 16 / 8; max-height: 190px; margin-bottom: 14px; }
.testata .copertina-p img { width: 100%; height: 100%; object-fit: cover; }
.testata .copertina-p button { position: absolute; inset: 0; width: 100%; border: 0; background: none; padding: 0; }
.testata .copertina-p .quante { position: absolute; right: 10px; bottom: 10px; background: rgba(27, 27, 30, 0.75); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; pointer-events: none; }
.testata .codice { color: var(--grigio); font-size: 14px; margin-top: 6px; }
.testata .stati { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.principale { background: var(--bianco); border: 1.5px solid var(--nero); border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; }
.principale .motivo { font-size: 15px; margin-bottom: 10px; }
.principale .btn { width: 100%; }
.principale .solo-testo { font-weight: 600; font-size: 16px; }
.contatti { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 15px; }
.contatti span { display: inline-flex; gap: 6px; align-items: center; }
.contatti a { text-decoration: none; }
.coppia { display: grid; grid-template-columns: 112px 1fr; gap: 7px 12px; font-size: 15px; margin: 0; }
.coppia dt { color: var(--grigio); }
.coppia dd { margin: 0; }
.coppia dd .tag { vertical-align: middle; }
.stima { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
.versione { border: 1px solid var(--linea); border-radius: var(--rb); padding: 12px 14px; margin-top: 10px; }
.versione .testa-v { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.versione .testa-v b { font-weight: 600; font-size: 16px; }
.storico { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.storico li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--linea); }
.storico li:first-child { border-top: 0; }
.storico .q { color: var(--grigio); }
textarea.campo, input.campo, select.campo { width: 100%; font: inherit; font-size: 16px; padding: 11px 13px; border-radius: var(--rb); border: 1px solid #d6d6d4; background: var(--bianco); margin-top: 6px; }
textarea.campo { resize: vertical; }
label.campo { display: block; font-size: 14px; color: var(--grigio); margin-top: 12px; }
label.campo input, label.campo select, label.campo textarea { color: var(--nero); }
.scelte { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.scelte label { padding: 9px 13px; border: 1px solid #d0d0d0; border-radius: 999px; font-size: 15px; background: var(--bianco); color: var(--nero); }
.scelte label:has(input:checked) { background: var(--nero); border-color: var(--nero); color: #fff; }
.scelte input { position: absolute; opacity: 0; width: 0; height: 0; }
.avviso { padding: 10px 12px; border-radius: var(--rb); font-size: 14px; margin-top: 10px; }
.avviso.ok { background: var(--ok-f); color: var(--ok); }
.avviso.err { background: var(--err-f); color: var(--err); }
.avviso.att { background: var(--att-f); color: #6b3d00; }

/* fotografie (dimostrative, da sostituire: cartella foto/, elenco in Altro → Foto dimostrative) */
.mini { width: 56px; height: 56px; border-radius: var(--rb); object-fit: cover; background: var(--tinta); flex: none; }
.mini-vuota { width: 56px; height: 56px; border-radius: var(--rb); background: var(--tinta); display: grid; place-items: center; color: var(--grigio-chiaro); flex: none; }
.galleria { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.galleria button { position: relative; padding: 0; border: 0; background: var(--tinta); border-radius: var(--rb); overflow: hidden; aspect-ratio: 1; }
.galleria img { width: 100%; height: 100%; object-fit: cover; }
.galleria .piu { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(27, 27, 30, 0.55); color: #fff; font-weight: 600; font-size: 18px; }
.didascalia { color: var(--grigio-chiaro); font-size: 12px; margin-top: 8px; }
.copertina { width: 100%; aspect-ratio: 16 / 8; max-height: 190px; object-fit: cover; border-radius: var(--r); margin-bottom: 14px; }
.visore { position: fixed; inset: 0; z-index: 80; background: #000; color: #fff; display: flex; flex-direction: column; animation: sfuma var(--t-apri) var(--molla); touch-action: pan-y; }
.visore.via { animation: sfuma-via var(--t-chiudi) var(--molla) forwards; }
.visore .vt { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; font-size: 14px; }
.visore .vt button { background: rgba(255, 255, 255, 0.12); border: 0; color: #fff; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 999px; }
.visore .vimg { flex: 1; display: grid; place-items: center; min-height: 0; padding: 0 8px; }
.visore .vimg img { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 4px; }
.visore .vb { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 13px; color: #bbb; }
.visore .vb button { background: rgba(255, 255, 255, 0.12); border: 0; color: #fff; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.visore .vb button[disabled] { opacity: 0.3; }

/* preventivo: voci */
.voce { display: grid; grid-template-columns: 1fr 1fr 36px; gap: 6px; align-items: center; padding: 10px 0; border-top: 1px solid var(--linea); }
.voce input:first-child { grid-column: 1 / -1; }
.voce:first-child { border-top: 0; }
.voce input.campo { margin: 0; padding: 8px 10px; font-size: 15px; }
.voce .togli { width: 36px; height: 38px; border: 0; background: none; color: var(--grigio); border-radius: var(--rb); display: grid; place-items: center; }
.voce .togli:hover { background: var(--err-f); color: var(--err); }
.voce.sola-lettura { grid-template-columns: 1fr auto auto; padding: 9px 0; font-size: 15px; }
.voce.sola-lettura .q { color: var(--grigio); font-size: 14px; }
.intest-voci { display: none; grid-template-columns: 1fr 76px 104px 36px; gap: 6px; color: var(--grigio); font-size: 13px; padding-bottom: 4px; }
.totali { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--linea); font-size: 15px; align-items: center; }
.totali b { font-size: 22px; letter-spacing: -0.3px; }
.righe { width: 100%; border-collapse: collapse; font-size: 14px; }
.righe td { padding: 8px 0; border-top: 1px solid var(--linea); vertical-align: top; }
.righe td:last-child { text-align: right; white-space: nowrap; }

/* agenda */
.agenda-testa { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.agenda-testa .tondo { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linea); background: var(--bianco); display: grid; place-items: center; }
.agenda-testa .titolo { flex: 1; font-weight: 600; font-size: 16px; text-align: center; }
.giorni-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 14px; }
.giorni-strip button { border: 0; background: none; padding: 6px 0 8px; border-radius: var(--rb); display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--grigio); font-size: 12px; }
.giorni-strip button b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 600; color: var(--nero); }
.giorni-strip button.oggi-g b { box-shadow: inset 0 0 0 1.5px var(--nero); }
.giorni-strip button.attivo b { background: var(--nero); color: #fff; box-shadow: none; }
.giorni-strip button i { width: 5px; height: 5px; border-radius: 50%; background: var(--grigio-chiaro); }
.giorni-strip button i.vuoto { background: transparent; }
.giorni-strip button.festivo { color: var(--grigio-chiaro); }
.impegno-r { width: 100%; text-align: left; background: none; border: 0; padding: 12px 0; display: grid; grid-template-columns: 62px 1fr auto; gap: 12px; align-items: stretch; }
.impegno-r .quando { display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
.impegno-r .quando b { font-size: 16px; font-weight: 600; }
.impegno-r .quando span { font-size: 13px; color: var(--grigio); }
.impegno-r .blocco { border-left: 3px solid var(--nero); padding-left: 12px; min-width: 0; }
.impegno-r .blocco.proposto { border-left-color: var(--att); }
.impegno-r .blocco.svolto { border-left-color: var(--grigio-chiaro); }
.impegno-r .blocco.altro { border-left-color: var(--grigio-chiaro); }
.impegno-r .blocco b { display: block; font-size: 16px; font-weight: 600; }
.impegno-r .blocco span { display: block; color: var(--grigio); font-size: 14px; }
.impegno-r .blocco .durata { color: var(--grigio-chiaro); font-size: 13px; }
.impegno-r .freccia { color: var(--grigio-chiaro); align-self: center; }
.giorno-libero { color: var(--grigio); font-size: 15px; padding: 24px 0; text-align: center; }
.settimana { display: none; }

/* tendina */

let D;
function carica() {
	try { const s = localStorage.getItem('am-prototipo-b01-v3'); if (s) { D = JSON.parse(s); return; } } catch {}
	D = datiIniziali();
}
function salva() { try { localStorage.setItem('am-prototipo-b01-v3', JSON.stringify(D)); } catch {} }
function azzera() { D = datiIniziali(); salva(); vai('oggi'); toast('Dati di prova ripristinati.'); }
const nuovoId = (p) => p + (++D.contatoreId);
const pratica = (id) => D.pratiche.find((p) => p.id === id);
const appDi = (id) => D.appuntamenti.filter((a) => a.praticaId === id).sort((a, b) => (a.giorno + a.inizio).localeCompare(b.giorno + b.inizio));
const prevDi = (id) => D.preventivi.filter((p) => p.praticaId === id).sort((a, b) => a.n - b.n);
const prevCorrente = (id) => prevDi(id).at(-1) ?? null;
const cliente = (id) => D.clienti.find((c) => c.id === id);
const nomeOp = (id) => OPERATORI.find((o) => o.id === id)?.nome ?? id;
const adessoIso = () => OGGI + 'T' + new Date().toTimeString().slice(0, 5);
const aperte = (a) => a.stato === 'proposto' || a.stato === 'confermato';
const chiusa = (p) => ['conclusa', 'non_proseguita'].includes(p.stato);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fotoDi = (p) => (Array.isArray(p.foto) ? p.foto : []);
const miniatura = (p) => { const f = fotoDi(p)[0] ?? FOTO_SERVIZIO[p.servizio]; return f ? `<img class="mini" src="${mini(f)}" alt="" loading="lazy" width="52" height="52">` : `<span class="mini-vuota">${I.pratiche}</span>`; };

/* visore delle foto (a tutto schermo, scorrimento col dito o con le frecce) */
let visore = null;
function apriVisore(praticaId, i = 0) {
	const p = pratica(praticaId); if (!p || !fotoDi(p).length) return;
	visore = { p, i };
	const s = document.getElementById('visore');
	s.innerHTML = `<div class="visore" role="dialog" aria-modal="true" aria-label="Foto"><div class="vt"><span></span><button type="button" onclick="chiudiVisore()">Chiudi</button></div><div class="vimg"><img alt=""></div><div class="vb"><button type="button" aria-label="Precedente" onclick="visoreVai(-1)">${I.indietro}</button><span class="vdid"></span><button type="button" aria-label="Successiva" onclick="visoreVai(1)">${I.freccia}</button></div></div>`;
	let x0 = null;
	s.firstChild.addEventListener('touchstart', (e) => (x0 = e.touches[0].clientX), { passive: true });
	s.firstChild.addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) visoreVai(dx < 0 ? 1 : -1); x0 = null; });
	visoreMostra();
}
function visoreMostra() {
	const { p, i } = visore, f = fotoDi(p), n = f[i], s = document.getElementById('visore');
	s.querySelector('.vimg img').src = src(n);
	s.querySelector('.vt span').textContent = `${i + 1} di ${f.length} · ${esc(p.nome)}`;
	s.querySelector('.vdid').textContent = `${FOTO[n]?.[0] ?? ''} · foto dimostrativa (Pexels, ${FOTO[n]?.[1] ?? ''})`;
	s.querySelector('.vb button:first-child').disabled = i === 0;
	s.querySelector('.vb button:last-child').disabled = i === f.length - 1;
}
function visoreVai(d) { if (!visore) return; const n = visore.i + d; if (n < 0 || n >= fotoDi(visore.p).length) return; visore.i = n; visoreMostra(); }
function chiudiVisore() {
	const s = document.getElementById('visore'); if (!s.firstChild) return;
	s.firstChild.classList.add('via'); visore = null;
	setTimeout(() => (s.innerHTML = ''), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 300);
}
const galleria = (p) => {
	const f = fotoDi(p); if (!f.length) return '';
	const mostra = f.slice(0, 3);
	return `<div class="galleria">${mostra.map((n, i) => `<button type="button" onclick="apriVisore('${p.id}',${i})" aria-label="Foto ${i + 1}"><img src="${mini(n)}" alt="${esc(FOTO[n]?.[0] ?? '')}" loading="lazy">${i === 2 && f.length > 3 ? `<span class="piu">+${f.length - 3}</span>` : ''}</button>`).join('')}</div><p class="didascalia">Foto dimostrative (Pexels), non lavori di ArtigianaMente. Si sostituiscono con quelle vere.</p>`;
};

const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
const GIORNI_B = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
const d = (s) => new Date(s.slice(0, 10) + 'T12:00:00Z');
const giornoLungo = (s) => { const x = d(s); return `${GIORNI[x.getUTCDay()]} ${x.getUTCDate()} ${MESI[x.getUTCMonth()]}`; };
const giornoBreve = (s) => { const x = d(s); return `${GIORNI_B[x.getUTCDay()]} ${x.getUTCDate()} ${MESI[x.getUTCMonth()].slice(0, 3)}`; };
const quando = (iso) => { if (!iso) return ''; const x = d(iso); return `${x.getUTCDate()} ${MESI[x.getUTCMonth()].slice(0, 3)}${iso.length > 10 ? ', ' + iso.slice(11, 16) : ''}`; };
const piuGiorni = (s, n) => { const x = d(s); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const lunediDi = (s) => piuGiorni(s, -((d(s).getUTCDay() + 6) % 7));
const giorniDa = (iso) => Math.round((d(OGGI) - d(iso)) / 86400000);
const euro = (n) => n.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const totali = (p) => { const imp = p.righe.reduce((s, r) => s + r[3], 0); const iva = Math.round(imp * p.iva) / 100; return { imp, iva, tot: imp + iva }; };

/* ===================== AZIONE SUGGERITA ===================== */
// Solo lettura: guarda il preventivo corrente e gli appuntamenti, non cambia niente. Il motivo è sempre scritto.
// «Verifica la pratica» solo per contraddizioni concrete, con scritto cosa non torna e un tasto per andare a vedere.
function suggerita(p) {
	const apps = appDi(p.id), pvs = prevDi(p.id), pv = pvs.at(-1) ?? null;
	const futuri = apps.filter((a) => aperte(a) && a.giorno >= OGGI);
	const passatiProposti = apps.filter((a) => a.stato === 'proposto' && a.giorno < OGGI);
	const lavoroAttivo = apps.find((a) => aperte(a) && a.tipo !== 'sopralluogo' && a.tipo !== 'altro');
	const sopr = apps.filter((a) => a.tipo === 'sopralluogo');
	const soprAperto = sopr.find((a) => aperte(a) && a.giorno >= OGGI);
	const soprSvolto = sopr.some((a) => a.stato === 'svolto');
	const accettate = pvs.filter((v) => v.stato === 'accettata');
	// contraddizioni concrete
	if (p.archiviata || chiusa(p)) {
		if (futuri.length) return { testo: 'Verifica la pratica', motivo: `Pratica «${NOMI_STATO[p.stato]}», ma c'è ancora un appuntamento attivo: ${NOMI_TIPO[futuri[0].tipo].toLowerCase()} ${giornoBreve(futuri[0].giorno)} alle ${futuri[0].inizio}. Annullalo o riapri la pratica.`, azione: 'imp-' + futuri[0].id };
		return null;
	}
	if (passatiProposti.length) { const a = passatiProposti[0]; return { testo: 'Verifica la pratica', motivo: `${NOMI_TIPO[a.tipo]} del ${giornoBreve(a.giorno)} ancora «proposto»: non è stato confermato né annullato. Cosa è successo?`, azione: 'imp-' + a.id }; }
	if (pv?.stato === 'rifiutata' && lavoroAttivo) return { testo: 'Verifica la pratica', motivo: `Preventivo ${pv.numero} registrato come rifiutato, ma ${NOMI_TIPO[lavoroAttivo.tipo].toLowerCase()} ancora confermato per ${giornoBreve(lavoroAttivo.giorno)}.`, azione: 'imp-' + lavoroAttivo.id };
	if (accettate.length > 1 || (accettate.length === 1 && pv && pv.stato !== 'accettata' && pv.stato !== 'bozza' && pv.stato !== 'superata')) return { testo: 'Verifica la pratica', motivo: `${pvs.length} versioni del preventivo e non è chiaro quale valga: ${pvs.map((v) => (v.numero ?? 'bozza v' + v.n) + ' ' + NOMI_PREV[v.stato].toLowerCase()).join(', ')}.`, azione: 'prev' };
	// passi normali
	if (p.stato === 'in_corso') {
		if (lavoroAttivo) return { testo: 'Lavoro in corso', motivo: `Prossima giornata ${giornoBreve(lavoroAttivo.giorno)} alle ${lavoroAttivo.inizio}.`, azione: null };
		return { testo: 'Programma o chiudi', motivo: 'Nessuna prossima giornata pianificata. Verifica se programmare un altro intervento o aggiornare lo stato.', azione: 'nuovo-lavoro' };
	}
	if (pv?.stato === 'accettata') {
		if (lavoroAttivo?.stato === 'proposto') return { testo: 'Conferma la data del lavoro', motivo: `Preventivo accettato. Lavoro proposto per ${giornoBreve(lavoroAttivo.giorno)}, non ancora confermato.`, azione: 'imp-' + lavoroAttivo.id };
		if (lavoroAttivo) return { testo: 'Tutto programmato', motivo: `Lavoro confermato per ${giornoBreve(lavoroAttivo.giorno)} alle ${lavoroAttivo.inizio}.${p.stato !== 'programmata' ? ` Lo stato è ancora «${NOMI_STATO[p.stato]}»: aggiornalo quando vuoi.` : ''}`, azione: p.stato !== 'programmata' ? 'stato' : null };
		return { testo: 'Programma il lavoro', motivo: 'Preventivo registrato come accettato. Nessun appuntamento di lavoro presente.', azione: 'nuovo-lavoro' };
	}
	if (pv?.stato === 'rifiutata') return { testo: 'Decidi come chiudere', motivo: 'Preventivo registrato come rifiutato. La pratica è ancora aperta.', azione: 'stato' };
	if (pv?.stato === 'inviata') return { testo: 'In attesa della risposta', motivo: `Preventivo inviato ${quando(pv.inviato)} (${giorniDa(pv.inviato)} giorni fa). Quando il cliente risponde, registralo qui.`, azione: 'prev' };
	if (pv?.stato === 'pronta') return { testo: 'Mandalo al cliente e segna inviato', motivo: `PDF ${pv.numero} pronto. L'invio lo fai tu (WhatsApp o email); poi registralo.`, azione: 'prev' };
	if (pv?.stato === 'bozza') return { testo: 'Completa la bozza e genera il PDF', motivo: 'Preventivo in bozza, nessun numero ancora.', azione: 'prev-' + pv.id };
	if (soprAperto?.stato === 'proposto') return { testo: 'Conferma il sopralluogo', motivo: `Sopralluogo proposto per ${giornoBreve(soprAperto.giorno)} alle ${soprAperto.inizio}, non confermato.`, azione: 'imp-' + soprAperto.id };
	if (soprAperto) return { testo: 'Sopralluogo fissato', motivo: `${giornoBreve(soprAperto.giorno)} alle ${soprAperto.inizio}. Dopo, prepara il preventivo.`, azione: null };
	if (soprSvolto) return { testo: 'Prepara il preventivo', motivo: 'Sopralluogo svolto, nessun preventivo ancora.', azione: 'prev' };
	if (!sopr.length) return { testo: 'Fissa il sopralluogo', motivo: p.stato === 'nuova' ? 'Richiesta nuova, nessun appuntamento.' : 'Nessun sopralluogo in agenda.', azione: 'nuovo-sopralluogo' };
	return { testo: 'Nessun passo suggerito', motivo: 'Dati non sufficienti per suggerire un passo.', azione: null };
}

/* ===================== OGGI: cosa fare ===================== */
// Regola: 1) prima ciò che richiede attenzione oggi (appuntamenti imminenti da confermare, con il motivo scritto);
// 2) poi tutto il resto dalla cosa più vecchia, con scritto da quanto attende. La categoria da sola non decide l'urgenza.
function daFare() {
	const out = [];
	for (const p of D.pratiche) {
		if (p.archiviata || chiusa(p)) continue;
		const pv = prevCorrente(p.id);
		const imminente = appDi(p.id).find((a) => a.stato === 'proposto' && a.giorno >= OGGI && a.giorno <= piuGiorni(OGGI, 1));
		if (imminente) out.push({ oggi: true, p, cosa: 'Da confermare', det: `${NOMI_TIPO[imminente.tipo]} ${imminente.giorno === OGGI ? 'oggi' : giornoBreve(imminente.giorno)} alle ${imminente.inizio} · ancora proposto`, da: imminente.giorno + 'T' + imminente.inizio });

		<section class="sez"><h2>Lavoro richiesto</h2><dl class="coppia"><dt>Lavoro</dt><dd><b>${esc(p.servizio)}</b></dd><dt>Dettagli</dt><dd>${esc(p.dettagli)}</dd>${p.preferenze ? `<dt>Preferenze</dt><dd>${esc(p.preferenze)}</dd>` : ''}${p.messaggio ? `<dt>Messaggio</dt><dd>«${esc(p.messaggio)}»</dd>` : ''}<dt>Stima vista dal cliente</dt><dd><span class="stima">${esc(p.stima) || '—'}</span>${p.stimaNota ? `<br><span class="nota">${esc(p.stimaNota)}</span>` : ''}</dd></dl></section>
		${f.length ? `<section class="sez"><h2>Foto <span class="conta">${f.length}</span></h2>${galleria(p)}</section>` : ''}
		<section class="sez" id="prev"><h2>Preventivo</h2>${bloccoPrev()}</section>
	</div>`;
	const colB = `<div class="foglio">
		<section class="sez"><h2>Appuntamenti ${!chiusa(p) ? `<button type="button" class="link" onclick="apriNuovoApp('${id}')">+ Nuovo</button>` : ''}</h2>${apps.length ? `<ul class="lista">${apps.map((a) => `<li><button type="button" class="riga" onclick="vai('imp','${a.id}')"><span class="ora num" style="min-width:64px">${giornoBreve(a.giorno)}<small>${a.inizio}–${a.fine}</small></span><span class="cosa"><b>${NOMI_TIPO[a.tipo]}</b><span>${a.chi.map(nomeOp).join(', ')}</span>${tagApp(a.stato)}</span><span class="freccia">${I.freccia}</span></button></li>`).join('')}</ul>` : `<p class="nota">Nessun appuntamento.${!chiusa(p) ? ` <button type="button" class="link" onclick="apriNuovoApp('${id}')">Fissa il primo</button>` : ''}</p>`}</section>

function agenda() {
	// Telefono: striscia dei 7 giorni della settimana + impegni del giorno scelto. Schermo largo: le 7 giornate affiancate.
	const lun = lunediDi(agendaGiorno);
	const giorni = Array.from({ length: 7 }, (_, i) => piuGiorni(lun, i));
	const del = (g) => D.appuntamenti.filter((a) => a.giorno === g && a.stato !== 'annullato').sort((a, b) => a.inizio.localeCompare(b.inizio));
	window._sposta = (n) => { agendaGiorno = piuGiorni(agendaGiorno, 7 * n); render(); };
	const titolo = `${giornoBreve(giorni[0])} – ${giornoBreve(giorni[6])}`;
	const nomeDi = (a) => { const p = a.praticaId ? pratica(a.praticaId) : null; return [p ? esc(p.nome) : esc(a.titolo), p ? `${NOMI_TIPO[a.tipo]}, ${lavoroBreve(p)}` : NOMI_TIPO[a.tipo]]; };
	const classe = (a) => a.stato === 'proposto' ? 'proposto' : a.stato === 'svolto' ? 'svolto' : a.praticaId ? '' : 'altro';
	const strip = `<div class="giorni-strip">${giorni.map((g) => { const n = del(g).length, dom = d(g).getUTCDay() === 0; return `<button type="button" class="${g === agendaGiorno ? 'attivo' : ''} ${g === OGGI ? 'oggi-g' : ''} ${dom ? 'festivo' : ''}" onclick="agendaGiorno='${g}';render()" aria-label="${giornoLungo(g)}">${GIORNI_B[d(g).getUTCDay()]}<b>${d(g).getUTCDate()}</b><i class="${n ? '' : 'vuoto'}"></i></button>`; }).join('')}</div>`;
	const listaGiorno = () => { const l = del(agendaGiorno); return `<section class="riquadro lista-giorno-largo"><h2>${giornoLungo(agendaGiorno).charAt(0).toUpperCase() + giornoLungo(agendaGiorno).slice(1)}${agendaGiorno === OGGI ? ' <span class="tag pieno">oggi</span>' : ''} <span class="conta">${l.length ? l.length + (l.length === 1 ? ' impegno' : ' impegni') : ''}</span></h2>${l.length ? `<ul class="lista">${l.map((a) => { const [n, t] = nomeDi(a); return `<li><button type="button" class="impegno-r" onclick="vai('imp','${a.id}')"><span class="quando num"><b>${a.inizio}</b><span>${a.fine}</span></span><span class="blocco ${classe(a)}"><b>${n}</b><span>${t} · ${a.chi.map(nomeOp).join(', ')}</span><span class="durata">${durata(a)}${a.stato === 'proposto' ? ' · da confermare' : a.stato === 'svolto' ? ' · svolto' : ''}</span></span><span class="freccia">${I.freccia}</span></button></li>`; }).join('')}</ul>` : `<p class="giorno-libero">Giornata libera.</p>`}</section>`; };
	const settimana = `<div class="settimana">${giorni.map((g) => { const l = del(g), dom = d(g).getUTCDay() === 0; return `<div class="colonna ${g === OGGI ? 'oggi-c' : ''} ${dom ? 'festivo' : ''}"><h3>${GIORNI_B[d(g).getUTCDay()]}<b>${d(g).getUTCDate()}</b></h3>${l.length ? l.map((a) => { const [n, t] = nomeDi(a); return `<button type="button" class="evento ${classe(a)}" onclick="vai('imp','${a.id}')"><b class="num">${a.inizio}–${a.fine}</b>${n}<span>${t}</span><span>${a.chi.map(nomeOp).join(', ')}${a.stato === 'proposto' ? ' · da confermare' : ''}</span></button>`; }).join('') : '<p class="libero">Libero</p>'}</div>`; }).join('')}</div>`;
	return testa('Agenda', '', `<button type="button" class="btn piccolo proposta" onclick="apriNuovoApp(null,null,'${agendaGiorno}')">${I.piu} Nuovo <span class="tag prop" style="background:#fff;color:#2f4a8a">da realizzare</span></button>`)
		+ `<div class="agenda-testa"><button type="button" class="tondo" aria-label="Settimana prima" onclick="_sposta(-1)">${I.indietro}</button><span class="titolo">${titolo.charAt(0).toUpperCase() + titolo.slice(1)}</span><button type="button" class="tondo" aria-label="Settimana dopo" onclick="_sposta(1)">${I.freccia}</button>${lun !== lunediDi(OGGI) || agendaGiorno !== OGGI ? `<button type="button" class="btn piccolo tinta" onclick="agendaGiorno='${OGGI}';render()">Oggi</button>` : ''}</div>`
		+ strip + listaGiorno() + settimana
		+ `<p class="nota" style="margin-top:10px">Un appuntamento nuovo si crea dalla pratica. «Nuovo» da qui: da realizzare.</p>`;
}

		+ `<div class="due"><div class="foglio"><section class="sez"><dl class="coppia"><dt>Quando</dt><dd><b>${giornoLungo(a.giorno).charAt(0).toUpperCase() + giornoLungo(a.giorno).slice(1)}</b><br><span class="num">${a.inizio}–${a.fine}</span> · ${durata(a)}</dd><dt>Dove</dt><dd>${esc(a.luogo)}</dd><dt>Chi va</dt><dd>${a.chi.map(nomeOp).join(', ')}</dd>${p ? `<dt>Cliente</dt><dd>${esc(p.nome)} · <a class="num" href="tel:${p.tel.replace(/\s/g, '')}" style="text-decoration:none">${p.tel}</a></dd><dt>Lavoro</dt><dd>${esc(p.dettagli)}</dd>` : ''}${a.stato === 'annullato' && a.motivo ? `<dt>Annullato</dt><dd>${esc(a.motivo)}</dd>` : ''}</dl>
		<div class="azioni">${a.stato === 'proposto' ? `<button type="button" class="btn" onclick="azioneApp('${a.id}','conferma')">Conferma</button>` : ''}${a.stato === 'confermato' ? `<button type="button" class="btn" onclick="azioneApp('${a.id}','svolto')">Segna svolto</button>` : ''}${aperte(a) ? `<button type="button" class="btn linea" onclick="apriSposta('${a.id}')">Sposta</button><button type="button" class="btn pericolo" onclick="apriAnnulla('${a.id}')">Annulla</button>` : ''}${p ? `<button type="button" class="btn linea" onclick="vai('p','${p.id}')">Apri la pratica</button>` : ''}</div></section></div>
		<div class="foglio"><section class="sez"><h2>Note per chi va</h2><textarea class="campo" rows="2" placeholder="es. citofono rotto, chiamare arrivando" onchange="salvaNoteApp('${a.id}',this.value)">${esc(a.note ?? '')}</textarea><p class="nota" style="margin-top:6px">Le vede ${a.chi.map(nomeOp).join(', ')}. Si salvano quando esci dal campo.</p></section></div></div>`;
}

function clienti() {
	const t = cercaTesto.trim().toLowerCase();
	const lista = D.clienti.filter((c) => !t || c.nome.toLowerCase().includes(t) || c.tel.replace(/\D/g, '').includes(t.replace(/\D/g, '') || '§')).sort((a, b) => a.nome.localeCompare(b.nome));
	return testa('Clienti', `${D.clienti.length} in anagrafica`, `<button type="button" class="btn piccolo linea" onclick="apriCliente(null)">${I.piu} Nuovo</button>`)
		+ `<input id="cerca" class="cerca" type="search" placeholder="Cerca per nome o telefono" value="${esc(cercaTesto)}" oninput="cercaTesto=this.value;render();const c=document.getElementById('cerca');c.focus();c.setSelectionRange(c.value.length,c.value.length)">`
		+ `<section class="riquadro">${lista.length ? `<ul class="lista">${lista.map((c) => { const n = D.pratiche.filter((p) => p.clienteId === c.id).length; return `<li><button type="button" class="riga" onclick="vai('cliente','${c.id}')"><span class="punto"></span><span class="cosa"><b>${esc(c.nome)}</b><span class="num">${c.tel} · ${n} pratic${n === 1 ? 'a' : 'he'}</span></span><span class="freccia">${I.freccia}</span></button></li>`; }).join('')}</ul>` : vuotoGrande('Nessun cliente trovato', `Niente per «${esc(cercaTesto)}».`)}</section>`
		+ `<p class="nota">Chi scrive dal sito entra in rubrica quando lo colleghi dalla sua pratica («Crea e collega»).</p>`;
}
function schedaCliente(id) {
	const c = cliente(id);
	if (!c) return testa('Cliente non trovato');
	const prs = D.pratiche.filter((p) => p.clienteId === id).sort((a, b) => b.ricevuta.localeCompare(a.ricevuta));
	return bottoneIndietro('Clienti') + testa(esc(c.nome))
		+ `<section class="riquadro"><div class="contatti"><span>${I.tel}<span class="num">${c.tel}</span></span>${c.email ? `<span>${I.mail}${esc(c.email)}</span>` : ''}</div><dl class="coppia" style="margin-top:12px"><dt>Indirizzo</dt><dd>${esc(c.indirizzo) || '<span class="nota">non indicato</span>'}</dd>${c.note ? `<dt>Note</dt><dd>${esc(c.note)}</dd>` : ''}</dl><div class="azioni"><button type="button" class="btn piccolo linea" onclick="apriCliente('${c.id}')">Modifica cliente</button></div></section>`
		+ `<section class="riquadro"><h2>Pratiche collegate <span class="conta">${prs.length}</span></h2>${prs.length ? `<ul class="lista">${prs.map((p) => `<li><button type="button" class="riga con-mini" onclick="vai('p','${p.id}')">${miniatura(p)}<span class="cosa"><b>${esc(titoloLavoro(p))}</b><span>${p.codice} · ${NOMI_STATO[p.stato]}</span></span><span class="freccia">${I.freccia}</span></button></li>`).join('')}</ul>` : '<p class="nota">Nessuna pratica collegata.</p>'}</section>`;
}
function apriCliente(id) {
	const c = id ? cliente(id) : { nome: '', tel: '', email: '', indirizzo: '', note: '' };
	apriTendina(`<label class="campo">Nome e cognome<input class="campo" name="cl-nome" value="${esc(c.nome)}" autocomplete="off"></label>
	<label class="campo">Telefono<input class="campo num" name="cl-tel" value="${esc(c.tel)}" inputmode="tel"></label>
	<label class="campo">Email (facoltativa)<input class="campo" name="cl-email" value="${esc(c.email)}" inputmode="email"></label>
	<label class="campo">Indirizzo<input class="campo" name="cl-indirizzo" value="${esc(c.indirizzo)}"></label>
	<label class="campo">Note (facoltative)<input class="campo" name="cl-note" value="${esc(c.note ?? '')}"></label>
	<div id="cl-esito"></div>
	<div class="azioni"><button type="button" class="btn pieno" onclick="salvaCliente('${id ?? ''}')">${id ? 'Salva le modifiche' : 'Crea il cliente'}</button><button type="button" class="btn linea pieno" onclick="chiudiTendina()">Annulla</button></div>`, id ? 'Modifica cliente' : 'Nuovo cliente');
	setTimeout(() => document.querySelector('[name="cl-nome"]')?.focus(), 50);
}
function salvaCliente(id) {
	if (bloccoRete()) return;
	const v = (n) => (valore(n) ?? '').trim();
	const dati = { nome: v('cl-nome'), tel: v('cl-tel'), email: v('cl-email'), indirizzo: v('cl-indirizzo'), note: v('cl-note') };
	if (dati.nome.length < 2) return esito('cl-esito', 'Serve il nome del cliente.');
	if (dati.tel.replace(/\D/g, '').length < 6) return esito('cl-esito', 'Controlla il telefono: troppo corto.');
	if (dati.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(dati.email)) return esito('cl-esito', 'L\'email non sembra giusta (manca la @ o il punto).');
	const doppio = D.clienti.find((c) => c.id !== id && c.tel.replace(/\D/g, '') === dati.tel.replace(/\D/g, ''));
	if (doppio && !id) return esito('cl-esito', `Questo numero è già di <b>${esc(doppio.nome)}</b>. <button type="button" class="link" onclick="chiudiTendina();vai('cliente','${doppio.id}')">Apri la sua scheda</button>`, 'att');
	if (id) { Object.assign(cliente(id), dati); salva(); chiudiTendina(); render(); toast('Cliente aggiornato.'); }
	else { const c = { id: nuovoId('c'), ...dati }; D.clienti.push(c); salva(); chiudiTendina(); toast('Cliente creato.'); vai('cliente', c.id); }
}

function cambiaRete(valore = !D.senzaRete) {

}

}

/* ===================== PREVENTIVO ===================== */
function creaPreventivo(praticaId, dallaStima) {

function apriStato(id) {
	const p = pratica(id);
	apriTendina(`<p class="nota">Adesso: ${NOMI_STATO[p.stato]}</p>${scelte('st-nuovo', Object.entries(NOMI_STATO).filter(([k]) => k !== 'nuova' && k !== 'chiusa_da_confermare'), p.stato)}<label class="campo">Nota (facoltativa)<input class="campo" name="st-nota"></label><div class="azioni"><button type="button" class="btn pieno" onclick="salvaStato('${id}')">Salva stato</button></div>`, 'Cambia stato');
}
function salvaStato(id) {
	if (bloccoRete()) return;
	const p = pratica(id), s = valore('st-nuovo');
	if (s !== p.stato) { p.stato = s; p.storico.push([adessoIso(), `Stato: ${NOMI_STATO[s]}${valore('st-nota') ? ' · ' + valore('st-nota') : ''}`]); }
	salva(); chiudiTendina(); render(); toast('Stato salvato.');
}
function salvaNote(id, v) { if (bloccoRete()) return; pratica(id).note = v; salva(); toast('Note salvate.'); }
function collegaCliente(id) {
	if (bloccoRete()) return;
	const p = pratica(id);
	const c = { id: nuovoId('c'), nome: p.nome, tel: p.tel, email: p.email, indirizzo: p.indirizzoCliente || p.indirizzoLavoro };
	D.clienti.push(c); p.clienteId = c.id; p.storico.push([adessoIso(), 'Cliente creato e collegato']);
	salva(); render(); toast('Cliente creato dalla richiesta e collegato.');
}
