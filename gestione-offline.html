<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="theme-color" content="#ffffff" />
		<title>Senza rete | Gestione</title>
		<style>
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f6f5; color: #1b1b1e; font-family: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
			main { max-width: 380px; margin: 16px; padding: 24px; background: #fff; border: 1px solid #e6e6e6; border-radius: 16px; display: grid; gap: 12px; }
			h1 { margin: 0; font-size: 22px; font-weight: 600; }
			p { margin: 0; color: #4a4a4a; line-height: 1.45; }
			button { font: inherit; font-weight: 600; font-size: 15px; padding: 13px 18px; border-radius: 10px; border: 1px solid #1b1b1e; background: #1b1b1e; color: #fff; cursor: pointer; }
		</style>
	</head>
	<body>
		<main>
			<h1>Senza rete</h1>
			<p>La Gestione ha bisogno della connessione: sul telefono non restano pratiche o appuntamenti salvati.</p>
			<p>Quando torna la rete, riprova.</p>
			<button type="button" onclick="location.reload()">Riprova</button>
		</main>
	</body>
</html>
